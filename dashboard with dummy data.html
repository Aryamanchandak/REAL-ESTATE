<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICICI Prudential — Real Estate Fund Dashboard</title>
<style>
/* =====================================================================
   IPRU REAL ESTATE FUND — EXECUTIVE DASHBOARD
   Boardroom design system · warm neutral + gold · Playfair / Inter
   =================================== ================================== */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  /* Primary chart/data tokens
     --brand-maroon = INK (charcoal primary) · --brand-orange = GOLD accent
     (names kept so components inherit the palette without churn) */
  --brand-maroon:   #E34234;   /* vermilion — primary series */
  --brand-maroon-d: #C0392B;
  --brand-orange:   #B8960C;   /* muted gold — single accent   */
  --brand-orange-d: #9C7E08;

  /* Per-asset colours are assigned dynamically in build_dashboard.py
     (ASSET_PALETTE → window.DASH.assetColors), not via CSS variables. */

  /* Data ramp — charcoal → gold → warm greys (two-tone discipline) */
  --d1: #17181C;   /* ink        */
  --d2: #B8960C;   /* gold       */
  --d3: #8C8678;   /* warm grey  */
  --d4: #C2BCAD;   /* light grey */
  --d5: #56524A;   /* dark grey  */
  --d6: #D0AE3A;   /* light gold */

  /* Status — muted, sophisticated traffic lights */
  --ok:      #4F7A52;
  --warn:    #B8860B;
  --danger:  #AE4A3C;
  --info:    #4E6577;

  --radius:   5px;
  --radius-s: 4px;
  --radius-l: 6px;

  --font:  "Inter", system-ui, -apple-system, sans-serif;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --mono:  "Inter", system-ui, sans-serif;   /* labels use Inter, tracked */

  --gutter: 56px;
  --maxw: 1440px;
}

/* ---------- LIGHT (warm boardroom) — default ---------- */
:root, [data-theme="light"]{
  --bg:        #F4F2EC;
  --bg-grad-a: #F6F4EE;
  --bg-grad-b: #EFEDE5;
  --surface:   #FCFBF8;
  --surface-2: #F4F2EB;
  --surface-3: #EDEAE1;
  --ink:       #17181C;
  --ink-2:     #5C584E;
  --ink-3:     #948F82;
  --line:      #E2DDD1;
  --line-2:    #ECE8DE;
  --vacant:    #E0DBCE;
  --cat-outsourcing: #E34234;
  --shadow:    none;
  --shadow-lg: 0 1px 2px rgba(30,25,15,.08), 0 18px 44px rgba(30,25,15,.12);
  --grid:      rgba(60,55,40,.10);
  --appbar-bg: rgba(252,251,248,.86);
}

/* ---------- DARK (charcoal command) ---------- */
[data-theme="dark"]{
  --bg:        #15171E;
  --bg-grad-a: #181B23;
  --bg-grad-b: #131520;
  --surface:   #16181F;
  --surface-2: #1B1E26;
  --surface-3: #22252F;
  --ink:       #F2F0E8;
  --ink-2:     #C9C4B6;
  --ink-3:     #948E7F;
  --line:      rgba(255,255,255,.09);
  --line-2:    rgba(255,255,255,.05);
  --vacant:    #2A2D36;
  --cat-outsourcing: #5E6373;
  --shadow:    none;
  --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
  --grid:      rgba(255,250,235,.07);
  --appbar-bg: rgba(15,17,23,.82);
  --brand-maroon: #DAD5C8;   /* light ink for bars on dark */
  --brand-orange: #C9A52A;   /* brighter gold */
  --d1: #E2DDD0;
  --d3: #8C8678;
  --d4: #5E5A50;
  --d5: #B4AE9F;
}

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}
#root{ min-height:100%; }
/* dark mode: light-on-dark text reads thin — nudge body weight up a step for legibility */
[data-theme="dark"] body{ font-weight:500; }
::selection{ background:color-mix(in srgb, var(--brand-orange) 26%, transparent); }

*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-thumb{ background:color-mix(in srgb,var(--ink-3) 38%, transparent); border-radius:20px; border:3px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-track{ background:transparent; }

.mono{ font-family:var(--mono); }
.serif{ font-family:var(--serif); }
.tnum{ font-variant-numeric:tabular-nums; }
.uplabel{ text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:500; color:var(--ink-3); }

/* ============ APP FRAME ============ */
.frame{ min-height:100vh; display:flex; flex-direction:column; }

.masthead{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:stretch;
  background:var(--appbar-bg); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.masthead-brand{
  display:flex; align-items:center; flex-shrink:0;
  padding:8px 40px 8px var(--gutter);
  border-right:1px solid var(--line);
}
.brand-logo{ height:90px; width:auto; display:block; border-radius:6px; flex-shrink:0; }
[data-theme="dark"] .brand-logo{ box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 1px 6px rgba(0,0,0,.35); }
.masthead-bars{ flex:1; display:flex; flex-direction:column; min-width:0; }

/* top control row */
.appbar-row{
  display:flex; align-items:center; gap:24px;
  padding:0 var(--gutter); height:64px;
  border-bottom:1px solid var(--line);
}
.wm-sub{ font-size:13px; font-weight:500; color:var(--ink-2); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.appbar-spacer{ flex:1; }

/* tab navigation (PDF-style) — centered */
.tabbar{
  flex:1; display:flex; align-items:center; justify-content:center;
  gap:2px; padding:0 var(--gutter); overflow-x:auto;
}
.tabbar::-webkit-scrollbar{ height:0; }
.tab{
  position:relative; border:none; background:none; cursor:pointer;
  padding:15px 18px 14px; font-family:var(--font); font-size:13px; font-weight:500;
  letter-spacing:.02em; color:var(--ink-2); white-space:nowrap; transition:color .18s;
}
.tab:hover{ color:var(--ink); }
.tab.active{ color:var(--ink); }
.tab.active::after{ content:""; position:absolute; left:18px; right:18px; bottom:-1px; height:2px; background:var(--brand-orange); }

/* right-side controls */
.ctrl-row{ display:flex; align-items:center; gap:14px; }
.month-tag{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; }

.seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden; }
.seg button{ border:none; background:none; font-family:var(--font); font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:7px 12px; cursor:pointer; transition:.16s; }
.seg button:hover{ color:var(--ink); }
.seg button.on{ background:var(--ink); color:var(--surface); }

.pill-select{ position:relative; }
.pill{ display:flex; align-items:center; gap:9px; background:transparent; border:1px solid var(--line); border-radius:var(--radius-s); padding:7px 12px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink); transition:.16s; }
.pill:hover{ border-color:var(--ink-3); }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

.dropdown{ position:absolute; top:calc(100% + 8px); right:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:5px; min-width:210px; z-index:60; }
.dd-item{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--radius-s); cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink); }
.dd-item:hover{ background:var(--surface-3); }
.dd-item .chk{ margin-left:auto; color:var(--brand-orange); font-size:11px; }

/* ============ CONTENT ============ */
.content{ flex:1; padding:40px var(--gutter) 80px; max-width:var(--maxw); width:100%; margin:0 auto; }

.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:34px; flex-wrap:wrap; }
.page-kicker{ text-transform:uppercase; letter-spacing:.18em; font-size:11.5px; font-weight:500; color:var(--brand-orange); margin-bottom:11px; }
.page-title{ font-family:var(--serif); font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; }
.page-meta{ text-align:right; font-size:12px; color:var(--ink-2); line-height:1.6; }
.page-meta b{ color:var(--ink); font-weight:600; }

/* ============ GRID / PANELS ============ */
.grid{ display:grid; gap:22px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 24px 0; }
.panel-title{ font-family:var(--serif); font-size:17px; font-weight:600; letter-spacing:-.01em; }
.panel-sub{ text-transform:uppercase; letter-spacing:.12em; font-size:10.5px; font-weight:500; color:var(--ink-3); margin-top:7px; }
.panel-body{ padding:20px 24px 24px; }

.section-label{ display:flex; align-items:center; gap:11px; margin:38px 0 16px; }
.section-label .bar{ width:18px; height:2px; background:var(--brand-orange); }
.section-label h3{ margin:0; text-transform:uppercase; letter-spacing:.16em; font-size:11px; color:var(--ink-2); font-weight:600; }

/* ============ KPI ============ */
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 22px 20px; }
.kpi-label{ text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:500; color:var(--ink-3); display:flex; align-items:center; gap:7px; }
.kpi-value{ font-family:var(--serif); font-size:clamp(24px,2.1vw,33px); font-weight:600; letter-spacing:-.02em; margin-top:14px; line-height:1; white-space:nowrap; }
.kpi-value .unit{ font-size:.46em; font-weight:500; color:var(--ink-2); margin-left:3px; font-family:var(--font); }
.kpi-foot{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-2); font-size:12.5px; color:var(--ink-2); display:flex; align-items:center; gap:7px; }
.trend{ font-weight:600; font-size:11.5px; display:inline-flex; align-items:center; gap:3px; }
.trend.up{ color:var(--ok); }
.trend.down{ color:var(--danger); }

/* ============ TABLES ============ */
.tbl-wrap{ overflow-x:auto; }
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th{ text-align:left; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--ink-3); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
table.tbl th.no-sort{ cursor:default; }
table.tbl th .sort-ar{ opacity:.35; margin-left:5px; font-size:8px; }
table.tbl th.sorted .sort-ar{ opacity:1; color:var(--brand-orange); }
table.tbl td{ padding:13px 16px; border-bottom:1px solid var(--line-2); color:var(--ink); vertical-align:middle; }
table.tbl tbody tr{ transition:background .14s; }
table.tbl tbody tr:hover{ background:var(--surface-2); }
table.tbl td.num{ text-align:right; font-variant-numeric:tabular-nums; }
table.tbl th.num{ text-align:right; }
table.tbl tr.total-row td{ font-weight:600; border-top:1px solid var(--line); border-bottom:none; }

/* badges */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:var(--radius-s); white-space:nowrap; }
.badge .bdot{ width:5px; height:5px; border-radius:50%; }
.badge.ok{ background:color-mix(in srgb,var(--ok) 13%,transparent); color:var(--ok); }
.badge.warn{ background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
.badge.danger{ background:color-mix(in srgb,var(--danger) 13%,transparent); color:var(--danger); }
.badge.info{ background:color-mix(in srgb,var(--info) 13%,transparent); color:var(--info); }
.badge.muted{ background:var(--surface-3); color:var(--ink-3); }

.achip{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; }
.achip .dot{ width:8px; height:8px; border-radius:2px; }

.search{ display:flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 12px; }
.search input{ border:none; background:none; outline:none; font-family:var(--font); font-size:12.5px; color:var(--ink); width:180px; }
.search input::placeholder{ color:var(--ink-3); }

/* tooltip */
.chart-tip{ position:fixed; pointer-events:none; z-index:200; background:var(--ink); color:var(--bg); border-radius:var(--radius-s); padding:10px 12px; font-size:11.5px; box-shadow:var(--shadow-lg); transform:translate(-50%,-118%); white-space:nowrap; opacity:0; transition:opacity .12s; }
[data-theme="dark"] .chart-tip{ border:1px solid var(--line); }
.chart-tip .tip-row{ display:flex; align-items:center; gap:8px; }
.chart-tip .tip-k{ text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; opacity:.65; }
.chart-tip b{ font-variant-numeric:tabular-nums; }
.chart-tip .tdot{ width:7px;height:7px;border-radius:2px; }

.legend{ display:flex; flex-wrap:wrap; gap:16px; }
.legend .li{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-2); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
.legend .li .sw{ width:10px; height:10px; border-radius:2px; }

.fade-in{ opacity:1; }
.muted{ color:var(--ink-3); }
.divider{ height:1px; background:var(--line); margin:0; border:none; }

</style>
</head>

<script type="text/babel">
/* =====================================================================
   CHART KIT — hand-built SVG charts (no external libraries)
   Components exported to window: Donut, HBars, VBars, LineChart,
   StackedBars, DistBars, MiniSpark
   ===================================================================== */
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- singleton tooltip ---------- */
function getTipEl(){
  let el = document.getElementById('__chartTip');
  if(!el){ el = document.createElement('div'); el.id='__chartTip'; el.className='chart-tip'; document.body.appendChild(el); }
  return el;
}
function showTip(html, x, y){
  const el = getTipEl();
  el.innerHTML = html; el.style.left = x+'px'; el.style.top = y+'px'; el.style.opacity = 1;
}
function hideTip(){ const el=document.getElementById('__chartTip'); if(el) el.style.opacity=0; }
window.showTip = showTip; window.hideTip = hideTip;

const fmtCr  = v => (v<0?'-':'') + '₹' + (Math.round(Math.abs(v)*10)/10).toLocaleString('en-IN') + 'Cr';
const fmtNum = v => v.toLocaleString('en-IN');
const cssVar = c => (c && c.startsWith('--')) ? `var(${c})` : c;
window.fmtCr = fmtCr; window.fmtNum = fmtNum;

/* ================= DONUT / GAUGE ================= */
function Donut({ value, label, sub, color="var(--brand-maroon)", size=168, track="var(--surface-3)", thickness=14, center }){
  const [p,setP] = useState(0);
  useEffect(()=>{ let raf2; const raf1=requestAnimationFrame(()=>{ raf2=requestAnimationFrame(()=>setP(value)); });
    return ()=>{ cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); }; },[value]);
  const r=(size-thickness)/2, c=2*Math.PI*r, off=c*(1-p/100);
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
      <div style={{position:'relative',width:size,height:size,display:'grid',placeItems:'center'}}>
        <svg width={size} height={size} style={{transform:'rotate(-90deg)',display:'block'}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={thickness}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={cssVar(color)} strokeWidth={thickness}
            strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
            style={{transition:'stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
          <div style={{fontSize:Math.round(size*.19),fontWeight:700,letterSpacing:'-.03em',lineHeight:1}} className="tnum">{center ?? (value+'%')}</div>
          {label && <div className="mono" style={{fontSize:9.5,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--ink-3)',marginTop:5}}>{label}</div>}
        </div>
      </div>
      {sub && <div style={{fontSize:11.5,color:'var(--ink-2)',marginTop:2}}>{sub}</div>}
    </div>
  );
}

/* ================= HORIZONTAL BARS ================= */
function HBars({ data, color="var(--brand-maroon)", unit="cr", height, valFmt }){
  const [on,setOn]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setOn(true),50); return ()=>clearTimeout(t); },[]);
  const max=Math.max(...data.map(d=>d.value))*1.08;
  const fmt = valFmt || (unit==='cr'?fmtCr:fmtNum);
  const h = height ?? Math.max(160, data.length*42);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:13,height:h,justifyContent:'center'}}>
      {data.map((d,i)=>(
        <div key={i}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${cssVar(d.color||color)}"></span><span class="tip-k">${d.name||d.label}</span></div><b>${fmt(d.value)}</b>`, e.clientX, e.clientY)}
          onMouseLeave={hideTip}
          style={{cursor:'default'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
            <span style={{fontSize:12.5,fontWeight:600}}>{d.name||d.label}</span>
            <span className="mono tnum" style={{fontSize:11.5,color:'var(--ink-2)'}}>{fmt(d.value)}</span>
          </div>
          <div style={{height:9,borderRadius:5,background:'var(--surface-3)',overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:5,width:on?`${d.value/max*100}%`:'0%',
              background:cssVar(d.color||color),
              transition:`width .32s cubic-bezier(.2,.8,.2,1) ${i*.06}s`}}/>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ================= VERTICAL GROUPED BARS ================= */
function VBars({ data, series, height=240, unit="cr", yTicks=4 }){
  const [on,setOn]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setOn(true),50); return ()=>clearTimeout(t); },[]);
  const fmt = unit==='cr'?fmtCr:fmtNum;
  const max = Math.max(...data.flatMap(d=>series.map(s=>d[s.key])))*1.12;
  const padB=26, padT=8, plotH=height-padB-padT;
  const ticks=Array.from({length:yTicks+1},(_,i)=>max*i/yTicks);
  return (
    <div>
      <div style={{display:'flex',height,position:'relative'}}>
        <div style={{position:'absolute',inset:`${padT}px 0 ${padB}px 0`,display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
          {ticks.slice().reverse().map((t,i)=>(<div key={i} style={{borderTop:'1px solid var(--grid)',position:'relative'}}>
            <span className="mono" style={{position:'absolute',left:0,top:-7,fontSize:9,color:'var(--ink-3)'}}>{Math.round(t)}</span>
          </div>))}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:0,paddingLeft:30,position:'relative',zIndex:1}}>
          {data.map((d,i)=>(
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:4,height:plotH,width:'100%',justifyContent:'center'}}>
                {series.map((s,j)=>(
                  <div key={j}
                    onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${d.m||d.label}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${ss.name}</span> <b style="margin-left:auto">${fmt(d[ss.key])}</b></div>`).join(''), e.clientX, e.clientY)}
                    onMouseLeave={hideTip}
                    style={{ width:`min(34px, ${70/series.length}%)`, height:on?`${d[s.key]/max*plotH}px`:'0px',
                      background:cssVar(s.color),
                      borderRadius:'4px 4px 0 0', transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.05+j*.03}s`, cursor:'default' }}/>
                ))}
              </div>
              <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)'}}>{d.m||d.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="legend" style={{marginTop:12,paddingLeft:30}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color)}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

/* ================= STACKED BARS ================= */
function StackedBars({ data, series, height=250, unit="cr" }){
  const [on,setOn]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setOn(true),50); return ()=>clearTimeout(t); },[]);
  const fmt = unit==='cr'?fmtCr:fmtNum;
  const totals = data.map(d=>series.reduce((a,s)=>a+d[s.key],0));
  const max=Math.max(...totals)*1.1, padB=26, plotH=height-padB;
  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-end',gap:0,height}}>

            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <div style={{width:'min(46px,64%)',height:plotH,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
                <div style={{display:'flex',flexDirection:'column-reverse',height:on?`${tot/max*plotH}px`:'0px',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.05}s`,borderRadius:'5px 5px 2px 2px',overflow:'hidden'}}>
                  {series.map((s,j)=>(
                    <div key={j}
                      onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${d.m||d.label}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${ss.name}</span> <b style="margin-left:auto">${fmt(d[ss.key])}</b></div>`).join('')+`<div class="tip-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.15);padding-top:4px"><span class="tip-k">Total</span> <b style="margin-left:auto">${fmt(tot)}</b></div>`, e.clientX, e.clientY)}
                      onMouseLeave={hideTip}
                      style={{height:`${d[s.key]/tot*100}%`,background:cssVar(s.color),cursor:'default'}}/>
                  ))}
                </div>
              </div>
              <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)'}}>{d.m||d.label}</span>
            </div>
          );
        })}
      </div>
      <div className="legend" style={{marginTop:12}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color)}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

/* ================= LINE / AREA CHART ================= */
function LineChart({ data, series, height=240, unit="cr", yKey, xKey="m" }){
  const wrapRef=useRef(null); const [w,setW]=useState(560);
  const [on,setOn]=useState(false);
  useEffect(()=>{ const r=()=>wrapRef.current&&setW(wrapRef.current.clientWidth); r(); window.addEventListener('resize',r); const t=setTimeout(()=>setOn(true),60); return ()=>{window.removeEventListener('resize',r);clearTimeout(t);}; },[]);
  const fmt = unit==='cr'?fmtCr:(unit==='psf'?(v=>'₹'+v+'/sf'):fmtNum);
  const padL=34,padR=12,padT=12,padB=26;
  const allVals=data.flatMap(d=>series.map(s=>d[s.key]));
  const max=Math.max(...allVals)*1.12, min=Math.min(0,...allVals);
  const plotW=w-padL-padR, plotH=height-padT-padB;
  const X=i=>padL + (data.length<=1?plotW/2:i/(data.length-1)*plotW);
  const Y=v=>padT + plotH - (v-min)/(max-min)*plotH;
  const ticks=4;
  return (
    <div ref={wrapRef} style={{position:'relative'}}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{display:'block',overflow:'visible'}}>
        {Array.from({length:ticks+1}).map((_,i)=>{ const v=min+(max-min)*i/ticks; const y=Y(v);
          return <g key={i}><line x1={padL} x2={w-padR} y1={y} y2={y} stroke="var(--grid)"/><text x={4} y={y+3} fontSize="9" fill="var(--ink-3)" fontFamily="var(--mono)">{Math.round(v)}</text></g>; })}
        {data.map((d,i)=><text key={i} x={X(i)} y={height-8} fontSize="9.5" fill="var(--ink-3)" textAnchor="middle" fontFamily="var(--mono)">{d[xKey]}</text>)}
        {series.map((s,si)=>{
          const pts=data.map((d,i)=>[X(i),Y(d[s.key])]);
          const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
          const area=`${line} L ${pts[pts.length-1][0]} ${Y(min)} L ${pts[0][0]} ${Y(min)} Z`;
          const col=cssVar(s.color);
          return (
            <g key={si}>
              {s.area!==false && <path d={area} fill={col} opacity={on?.10:0} style={{transition:'opacity .3s'}}/>}
              <path d={line} fill="none" stroke={col} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
                style={{strokeDasharray:1400,strokeDashoffset:on?0:1400,transition:`stroke-dashoffset .6s ease ${si*.15}s`}}/>
              {pts.map((p,i)=>(
                <g key={i}>
                  <circle cx={p[0]} cy={p[1]} r="9" fill="transparent"
                    onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${data[i][xKey]}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${ss.name}</span> <b style="margin-left:auto">${fmt(data[i][ss.key])}</b></div>`).join(''), e.clientX, e.clientY)}
                    onMouseLeave={hideTip} style={{cursor:'default'}}/>
                  <circle cx={p[0]} cy={p[1]} r="3.6" fill="var(--surface)" stroke={col} strokeWidth="2.2" style={{opacity:on?1:0,transition:`opacity .4s ease ${.6+i*.05}s`,pointerEvents:'none'}}/>
                </g>
              ))}
            </g>
          );
        })}
      </svg>
      {series.length>1 && <div className="legend" style={{marginTop:6,paddingLeft:padL}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color),borderRadius:2}}></span>{s.name}</div>))}
      </div>}
    </div>
  );
}

/* ================= DISTRIBUTION BARS (rent spread) ================= */
function DistBars({ data, colors=['var(--d4)','var(--d3)','var(--brand-maroon)','var(--brand-orange)'], unit="M sft", height=210 }){
  const [on,setOn]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setOn(true),50); return ()=>clearTimeout(t); },[]);
  const max=Math.max(...data.map(d=>d.area))*1.12;
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:14,height,paddingTop:8}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,height:'100%',justifyContent:'flex-end'}}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${cssVar(colors[i%colors.length])}"></span><span class="tip-k">${d.band}</span></div><b>${d.area} ${unit}</b>`, e.clientX, e.clientY)}
          onMouseLeave={hideTip}>
          <span className="tnum" style={{fontSize:13,fontWeight:700}}>{d.area}</span>
          <div style={{width:'100%',maxWidth:60,height:on?`${d.area/max*100}%`:'0%',
            background:cssVar(colors[i%colors.length]),
            borderRadius:'4px 4px 0 0',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.07}s`,cursor:'default'}}/>
          <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)',textAlign:'center',lineHeight:1.2}}>{d.band}</span>
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { Donut, HBars, VBars, StackedBars, LineChart, DistBars });

</script>

/* ---------- Tab navigation ---------- */
function TabNav({ nav, active, onNav }){
  return (
    <div className="tabbar">
      {nav.map(n=>(
        <button key={n.id} className={"tab"+(active===n.id?" active":"")} onClick={()=>onNav(n.id)}>{n.tab}</button>
      ))}
    </div>
  );
}

/* ---------- Page header ---------- */
function PageHead({ kicker, title }){
  return (
    <div className="page-head">
      <div>
        <div className="page-kicker">{kicker}</div>
        <h1 className="page-title">{title}</h1>
      </div>
    </div>
  );
}

/* ---------- KPI ---------- */
function Kpi({ label, value, unit, foot, trend, trendDir }){
  return (
    <div className="kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value tnum">{value}{unit && <span className="unit">{unit}</span>}</div>
      {(foot||trend) && <div className="kpi-foot">
        {trend && <span className={"trend "+(trendDir||'up')}>{trendDir==='down'?'▾':'▴'} {trend}</span>}
        {foot && <span>{foot}</span>}
      </div>}
    </div>
  );
}

/* ---------- Panel ---------- */
function Panel({ title, sub, right, children, pad=true, style }){
  return (
    <div className="panel" style={style}>
      {(title||right) && <div className="panel-head">
        <div>{title && <div className="panel-title">{title}</div>}{sub && <div className="panel-sub">{sub}</div>}</div>
        {right}
      </div>}
      <div className="panel-body" style={pad?null:{padding:0}}>{children}</div>
    </div>
  );
}

/* ---------- Badge ---------- */
const STATUS_MAP = {
  "Complied":"ok","OK":"ok","Low":"ok",
  "Due Soon":"warn","In Progress":"info","Medium":"warn",
  "Revision Required":"danger","High":"danger",
  "Not Due":"muted","Not Applicable":"muted","NA":"muted",
};
function Badge({ children, kind }){
  const k = kind || STATUS_MAP[children] || "muted";
  return <span className={"badge "+k}><span className="bdot" style={{background:'currentColor'}}></span>{children}</span>;
}

/* ---------- Sortable / filterable DataTable ---------- */
function DataTable({ columns, rows, totalRow, searchable=true, initialSort }){
  const [q,setQ]=uS("");
  const [sort,setSort]=uS(initialSort||{key:null,dir:1});
  const filtered = uM(()=>{
    let r=rows;
    if(q.trim()){ const s=q.toLowerCase(); r=r.filter(row=>columns.some(c=>String(row[c.key]??'').toLowerCase().includes(s))); }
    if(sort.key){ const c=columns.find(c=>c.key===sort.key);
      r=[...r].sort((a,b)=>{ let av=a[sort.key],bv=b[sort.key];
        if(c&&c.num){ av=parseFloat(av)||0; bv=parseFloat(bv)||0; return (av-bv)*sort.dir; }
        return String(av).localeCompare(String(bv))*sort.dir; }); }
    return r;
  },[q,sort,rows,columns]);
  const toggle=k=>setSort(s=>s.key===k?{key:k,dir:-s.dir}:{key:k,dir:1});
  return (
    <div>
      {searchable && <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,gap:12,flexWrap:'wrap'}}>
        <div className="search"><input placeholder="Filter…" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <span className="uplabel">{filtered.length} of {rows.length} rows</span>
      </div>}
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            {columns.map(c=>(
              <th key={c.key} className={(c.num?'num ':'')+(c.noSort?'no-sort ':'')+(sort.key===c.key?'sorted':'')}
                onClick={()=>!c.noSort&&toggle(c.key)}>
                {c.label}{!c.noSort && <span className="sort-ar">{sort.key===c.key?(sort.dir>0?'▲':'▼'):'⇅'}</span>}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {filtered.map((row,i)=>(
              <tr key={i}>
                {columns.map(c=>(
                  <td key={c.key} className={c.num?'num':''}>{c.render?c.render(row[c.key],row):row[c.key]}</td>
                ))}
              </tr>
            ))}
            {totalRow && <tr className="total-row">
              {columns.map((c,i)=>(<td key={c.key} className={c.num?'num':''}>{totalRow[c.key]??(i===0?'Total':'')}</td>))}
            </tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

Object.assign(window, { TopBar, TabNav, PageHead, Kpi, Panel, Badge, DataTable, assetColorOf });

</script>

<script type="text/babel">
/* =====================================================================

   ===================================================================== */
const assetColor = id => (window.DASH.assetColors||{})[id]||'var(--ink-3)';

/* ============================ INVESTMENT / PORTFOLIO ============================ */
function InvestmentSection({ asset }){

  // asset dropdown (which drives the per-asset detail tabs).

  const tableRows = filtered.map(a=>({
    name:a.name, id:a.id, leasable:a.leasable, leased:a.leased, vacant:a.vacant, occupancy:a.occupancy, monthlyRent:a.monthlyRent
  }));
  const totals = filtered.reduce((t,a)=>({leasable:t.leasable+a.leasable,leased:t.leased+a.leased,vacant:t.vacant+a.vacant,monthlyRent:t.monthlyRent+a.monthlyRent}),{leasable:0,leased:0,vacant:0,monthlyRent:0});
  const totOcc = (totals.leased/totals.leasable*100);

    <div className="fade-in">

        <Kpi label="CAM Charge" value={`₹${P.camCharge}`} unit="/sf" accent="var(--d3)" foot="weighted average"/>
        <Kpi label="Gross Billing" value={fmtCr(head.gross)} accent="var(--d4)" foot="incl. taxes"/>
        <Kpi label="Collections" value={fmtCr(head.coll)} accent="var(--d5)" foot="collection efficiency"/>
      </div>

      {/* main grid */}
      <div className="grid" style={{gridTemplateColumns:'1.55fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Assets Summary" sub={`${D.meta.reportMonth} · ${filtered.length} ${filtered.length>1?'assets':'asset'}`} pad={false}>
          <div style={{padding:'0 4px 4px'}}>
          <DataTable
            searchable={false}
            initialSort={{key:'monthlyRent',dir:-1}}
            columns={[
              {key:'name',label:'Asset',render:(v,r)=><span className="achip"><span className="dot" style={{background:assetColor(r.id)}}></span>{v}</span>},

          />
          </div>
        </Panel>

        <Panel title="Portfolio Occupancy" sub="leased vs leasable">
          <div style={{display:'flex',alignItems:'center',gap:20,flexWrap:'wrap',justifyContent:'center'}}>

function AreaStat({ label, value, unit, color }){
  return (
    <div style={{display:'flex',alignItems:'center',gap:11}}>
      <span style={{width:10,height:10,borderRadius:3,background:color,flexShrink:0}}></span>

        <div className="tnum" style={{fontSize:18,fontWeight:700,letterSpacing:'-.02em'}}>{value}<span style={{fontSize:11,color:'var(--ink-2)',fontWeight:600,marginLeft:3}}>{unit}</span></div>
      </div>
    </div>
  );
}

function RevComposition({ data }){
  const total = data.reduce((a,d)=>a+d.value,0);
  const colors=['var(--brand-maroon)','var(--brand-orange)','var(--d3)','var(--d5)'];
  const [on,setOn]=React.useState(false);
  React.useEffect(()=>{const t=setTimeout(()=>setOn(true),50);return ()=>clearTimeout(t);},[]);
  return (
    <div>
      <div style={{display:'flex',height:18,borderRadius:6,overflow:'hidden',marginBottom:16}}>
        {data.map((d,i)=>(

            <span className="mono tnum" style={{fontSize:11,color:'var(--ink-3)',width:38,textAlign:'right'}}>{Math.round(d.value/total*100)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ EXECUTIVE SUMMARY ============================ */
function ExecutiveSection({ asset }){
  const D = window.DASH;
  const aId = asset;
  const aMeta = D.assets.find(a=>a.id===aId) || D.assets[0];
  const E = D.executive[aId] || {topTenants:[],rentalPsfTrend:[],billedVsActual:[]};

              <div className="mono" style={{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-3)',marginTop:5}}>sft leasable area</div>
            </div>
            <div style={{display:'flex',gap:18}}>
              <div><div className="mono" style={{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>WALE</div><div style={{fontSize:18,fontWeight:700}} className="tnum">{E.wale!=null?E.wale:dash} <span style={{fontSize:11,color:'var(--ink-2)'}}>yrs</span></div></div>
              <div><div className="mono" style={{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>Asset</div><div style={{marginTop:3}}><span className="achip"><span className="dot" style={{background:assetColor(aId)}}></span>{aMeta.name}</span></div></div>
            </div>
          </div>
        </Panel>
        <Kpi label="Rent to be Billed" value={billedAvg!=null?fmtCr(billedAvg):dash} accent="var(--brand-maroon)" foot="monthly avg · w/o tax"/>

      <div className="grid" style={{gridTemplateColumns:'1.4fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Rent to be Billed vs Actual" sub="₹Cr · without tax">

            : <div style={{padding:'48px 12px',textAlign:'center',color:'var(--ink-3)'}}>No billing data for this asset.</div>}
        </Panel>
        <Panel title="Top Tenants" sub="by monthly rent · ₹Cr">
          {E.topTenants.length

      <div className="grid" style={{gridTemplateColumns:'1.4fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Current & Future Avg Rental PSF" sub="₹/sf · weighted average">
          {(E.rentalPsfTrend||[]).length

            <div style={{flex:1,minWidth:150,display:'flex',flexDirection:'column',gap:14}}>
              <AreaStat label="Total Area" value={`${E.totalArea!=null?E.totalArea:dash}M`} unit="sft" color="var(--ink-3)"/>
              <AreaStat label="Leased Area" value={`${E.leasedArea!=null?E.leasedArea:dash}M`} unit="sft" color="var(--brand-maroon)"/>
              <AreaStat label="Vacant Area" value={`${E.vacantArea!=null?E.vacantArea:dash}M`} unit="sft" color="var(--vacant)"/>
            </div>
          </div>
        </Panel>
      </div>
    </div>
  );
}

Object.assign(window, { InvestmentSection, ExecutiveSection, assetColor });

<script type="text/babel">

          <div style={{display:'flex',justifyContent:'space-between'}}><span style={{fontSize:12.5,fontWeight:700}}>Grand Total</span><span className="mono tnum" style={{fontWeight:700,color:'var(--danger)'}}>–{fmtCr(F.usage.reduce((a,b)=>a+b.value,0))}</span></div>

/* ============================ EXPENSE vs COLLECTION ============================ */
function ExpenseSection({ asset }){
  const D = window.DASH;
  const X = D.expenses[asset] || {monthly:[], billedVsActual:[]};
  const totals = X.monthly.reduce((t,m)=>({coll:t.coll+m.collection,cam:t.cam+m.cam,debt:t.debt+m.debt,opex:t.opex+m.opex}),{coll:0,cam:0,debt:0,opex:0});
  const totExp = totals.cam+totals.debt+totals.opex;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <Kpi label="Total Collections" value={fmtCr(totals.coll)} accent="var(--ok)" icon="finance" foot="trailing 6 months"/>
        <Kpi label="Total Expenses" value={fmtCr(totExp)} accent="var(--danger)" icon="expense" foot="CAM + Debt + OPEX"/>
        <Kpi label="Net Surplus" value={fmtCr(totals.coll-totExp)} trend={Math.abs(Math.round((totals.coll-totExp)/totals.coll*100))+'%'} trendDir={totals.coll-totExp>=0?'up':'down'} foot="collection less expense"/>
        <Kpi label="Cost-to-Collection" value={Math.round(totExp/totals.coll*100)} unit="%" accent="var(--d3)" foot="expense ratio"/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Expense vs Collection" sub="₹Cr · collections vs stacked expense categories">
          <ExpenseCombo data={X.monthly}/>
        </Panel>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Rent to be Billed vs Actual" sub="₹Cr · without tax">
          <LineChart data={X.billedVsActual} series={[{key:'billed',name:'Rent to be Billed',color:'var(--brand-maroon)'},{key:'actual',name:'Actual Billed',color:'var(--brand-orange)'}]} unit="cr" height={240}/>
        </Panel>
      </div>
    </div>
  );
}

/* collections line overlaid on stacked expense bars */
function ExpenseCombo({ data }){
  const wrapRef=React.useRef(null); const [w,setW]=React.useState(800); const [on,setOn]=React.useState(false);
  React.useEffect(()=>{ const r=()=>wrapRef.current&&setW(wrapRef.current.clientWidth); r(); window.addEventListener('resize',r); const t=setTimeout(()=>setOn(true),60); return ()=>{window.removeEventListener('resize',r);clearTimeout(t);}; },[]);
  const series=[{key:'cam',name:'CAM',color:'var(--d2)'},{key:'debt',name:'Debt',color:'var(--brand-maroon)'},{key:'opex',name:'OPEX',color:'var(--d5)'}];
  const height=330,padL=48,padR=16,padT=16,padB=30;
  const expTot=data.map(d=>d.cam+d.debt+d.opex);
  const rawMax=Math.max(...data.map(d=>d.collection),...expTot);
  const max=Math.ceil(rawMax/100)*100*1.05;
  const plotW=w-padL-padR, plotH=height-padT-padB;
  const slot=plotW/data.length;
  const barW=Math.min(26, slot*0.26);
  const gap=Math.min(10, slot*0.06);
  const Y=v=>padT+plotH-v/max*plotH;
  const baseY=padT+plotH;
  return (
    <div ref={wrapRef}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{display:'block',overflow:'visible'}}>
        {Array.from({length:5}).map((_,i)=>{ const v=max*i/4,y=Y(v);
          return <g key={i}><line x1={padL} x2={w-padR} y1={y} y2={y} stroke="var(--grid)"/><text x={padL-8} y={y+3} fontSize="9.5" fill="var(--ink-3)" fontFamily="var(--mono)" textAnchor="end">{'₹'+Math.round(v)}</text></g>; })}
        {data.map((d,i)=>{ const cx=padL + slot*i + slot/2; const tot=expTot[i]; let acc=0;
          const collX=cx-barW-gap/2, expX=cx+gap/2;
          const tip=`<div class="tip-row"><span class="tip-k">${d.m}</span></div><div class="tip-row"><span class="tdot" style="background:var(--ok)"></span><span>Collection</span> <b style="margin-left:auto">${fmtCr(d.collection)}</b></div>`+series.map(s=>`<div class="tip-row"><span class="tdot" style="background:${s.color}"></span><span>Expense · ${s.name}</span> <b style="margin-left:auto">${fmtCr(d[s.key])}</b></div>`).join('')+`<div class="tip-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.18);padding-top:4px"><span class="tip-k">Total Expense</span> <b style="margin-left:auto">${fmtCr(tot)}</b></div>`;
          return (
            <g key={i} onMouseMove={e=>showTip(tip,e.clientX,e.clientY)} onMouseLeave={hideTip} style={{cursor:'default'}}>
              {/* collection bar */}
              <rect x={collX} y={on?Y(d.collection):baseY} width={barW} height={on?baseY-Y(d.collection):0} fill="var(--ok)" rx="3" style={{transition:`all .32s cubic-bezier(.2,.8,.2,1) ${i*.05}s`}}/>
              {/* stacked expense bar — single rounded top via clip, square segments */}
              <defs><clipPath id={'ec'+i}><rect x={expX} y={Y(tot)} width={barW} height={baseY-Y(tot)} rx="3"/></clipPath></defs>
              <g clipPath={`url(#ec${i})`}>
              {series.map((s,si)=>{ const segH=d[s.key]/max*plotH; const y=baseY-(acc+d[s.key])/max*plotH; acc+=d[s.key];
                return <rect key={si} x={expX} y={on?y:baseY} width={barW} height={on?segH:0} fill={s.color} rx={0} style={{transition:`all .32s cubic-bezier(.2,.8,.2,1) ${i*.05+si*.02}s`}}/>; })}
              </g>
              <text x={cx} y={height-10} fontSize="9.5" fill="var(--ink-3)" textAnchor="middle" fontFamily="var(--mono)">{d.m}</text>
            </g>
          ); })}
      </svg>
      <div className="legend" style={{marginTop:10,paddingLeft:padL}}>
        <div className="li"><span className="sw" style={{background:'var(--ok)'}}></span>Collections</div>
        <span style={{color:'var(--ink-3)',fontSize:11}}>Expense:</span>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:s.color}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

Object.assign(window, { FinancialSection, ExpenseSection });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Stack Plan + Tenant Profile
   ===================================================================== */

/* ============================ STACK PLAN ============================ */
function StackSection({ asset }){
  const D = window.DASH;
  const aId = asset;
  const S = (D.stackPlan&&D.stackPlan[aId]) || {asset:aId,legend:[],floors:[]};
  const pickName = (D.assets.find(a=>a.id===aId)||{}).name || S.asset;
  const [hl,setHl]=React.useState(null); // highlighted category
  const catColor = key => (S.legend.find(l=>l.key===key)||{}).color;
  const totalK = S.floors.flatMap(f=>f.units).reduce((a,u)=>a+u.k,0);
  const vacantK = S.floors.flatMap(f=>f.units).filter(u=>u.cat==='vacant').reduce((a,u)=>a+u.k,0);
  // floor max width for proportional sizing
  const floorTotals = S.floors.map(f=>f.units.reduce((a,u)=>a+u.k,0));
  const maxFloor = Math.max(...floorTotals);

  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <Kpi label="Asset" value={pickName} accent={assetColor(aId)} icon="stack"/>
        <Kpi label="Total Floor Area" value={totalK} unit="K sft" accent="var(--brand-maroon)"/>
        <Kpi label="Vacant Area" value={vacantK} unit="K sft" accent="var(--warn)" foot={`${totalK ? Math.round(vacantK/totalK*100) : 0}% of stack`}/>
        <Kpi label="Floors" value={S.floors.length} accent="var(--d3)" foot="leasable floors"/>
      </div>

      <Panel title="Stacking Plan" sub={`${pickName} · grouped by industry`} style={{marginTop:18}}
        right={<div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <div className="legend">{S.legend.map(l=>(
          <div key={l.key} className="li" style={{cursor:'pointer',opacity:hl&&hl!==l.key?.4:1}}
            onMouseEnter={()=>setHl(l.key)} onMouseLeave={()=>setHl(null)}>
            <span className="sw" style={{background:l.color}}></span>{l.label}
          </div>))}</div>
        </div>}>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {S.floors.length===0 && <div style={{padding:'48px 12px',textAlign:'center',color:'var(--ink-3)'}}>No stacking data for this asset.</div>}
          {S.floors.map(f=>{ const ft=f.units.reduce((a,u)=>a+u.k,0);
            return (
              <div key={f.floor} style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:54,flexShrink:0,textAlign:'right'}}>
                  <div className="mono" style={{fontSize:9,color:'var(--ink-3)',letterSpacing:'.1em'}}>FLOOR</div>
                  <div style={{fontSize:20,fontWeight:700,lineHeight:1}} className="tnum">{f.floor}</div>
                </div>
                <div style={{flex:1,display:'flex',gap:5,height:54,width:`${ft/maxFloor*100}%`}}>
                  {f.units.map((u,i)=>{ const dim = hl && hl!==u.cat;
                    return (
                      <div key={i}
                        onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${catColor(u.cat)}"></span><span class="tip-k">${(S.legend.find(l=>l.key===u.cat)||{}).label}</span></div><b>${u.t}</b><div style="opacity:.7;margin-top:2px">${u.k}K sft</div>`,e.clientX,e.clientY)}
                        onMouseLeave={hideTip}
                        style={{flex:u.k,minWidth:0,borderRadius:7,padding:'8px 11px',display:'flex',flexDirection:'column',justifyContent:'center',cursor:'default',
                          background: u.cat==='vacant'?'repeating-linear-gradient(45deg,var(--vacant),var(--vacant) 7px,transparent 7px,transparent 14px)':catColor(u.cat),
                          border: u.cat==='vacant'?'1px dashed var(--ink-3)':'none',
                          color: u.cat==='vacant'?'var(--ink-2)':'#fff',
                          opacity:dim?.25:1, transition:'opacity .2s', overflow:'hidden'}}>
                        <div style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.t}</div>
                        <div className="mono" style={{fontSize:10,opacity:.85,whiteSpace:'nowrap'}}>{u.k}K sft</div>
                      </div>
                    ); })}
                </div>
              </div>
            ); })}
        </div>
      </Panel>
    </div>
  );
}

/* ============================ TENANT PROFILE ============================ */
function TenantSection({ asset }){
  const D = window.DASH;
  const aId = asset;
  const T = (D.tenant&&D.tenant[aId]) || {asset:aId,topTenants:[],effectiveLed:'—',leaseExpiry:[]};
  const top0 = T.topTenants[0];
  const totalExpiry = T.leaseExpiry.reduce((a,d)=>a+d.sft,0);
  const maxExpiry = T.leaseExpiry.length ? Math.max(...T.leaseExpiry.map(d=>d.sft)) : 0;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <Kpi label="Asset" value={(D.assets.find(a=>a.id===aId)||{}).name || T.asset} accent={assetColor(aId)} icon="tenant"/>
        <Kpi label="Top Tenant" value={top0 ? top0.name : '—'} accent="var(--brand-maroon)" foot={top0 ? `${fmtCr(top0.rent)} / month` : 'No tenants on record'}/>
        <Kpi label="Area Expiring" value={(totalExpiry/1000).toFixed(0)} unit="K sft" accent="var(--warn)" foot="across all quarters"/>
        <Kpi label="Effective LED" value={T.effectiveLed || '—'} accent="var(--d3)" icon="clock" foot="lease end date"/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr 1.6fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Top Tenants" sub="by monthly rent · ₹Cr">
          {T.topTenants.length
            ? <HBars data={T.topTenants.map(t=>({name:t.name,value:t.rent}))}/>
            : <div style={{padding:'48px 12px',textAlign:'center',color:'var(--ink-3)'}}>No tenant data for this asset.</div>}
        </Panel>
        <Panel title="Upcoming Lease Expiry" sub="sq.ft expiring by quarter">
          <ExpiryChart data={T.leaseExpiry}/>
        </Panel>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Lease Expiry Schedule</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            initialSort={{key:'sft',dir:-1}}
            columns={[
              {key:'q',label:'Quarter',render:v=><span className="mono" style={{fontWeight:600,fontSize:11.5}}>{v}</span>},
              {key:'sft',label:'Area Expiring (sft)',num:true,render:v=>v.toLocaleString('en-IN')},
              {key:'share',label:'Share of Total',num:true,render:(_,r)=>(r.sft/(totalExpiry||1)*100).toFixed(1)+'%'},
              {key:'bar',label:'',noSort:true,render:(_,r)=><div style={{height:8,width:120,background:'var(--surface-3)',borderRadius:5,overflow:'hidden'}}><div style={{height:'100%',width:`${r.sft/(maxExpiry||1)*100}%`,background:'var(--brand-orange)',borderRadius:5}}></div></div>},
            ]}
            rows={T.leaseExpiry.filter(d=>d.sft>0)}
          />
        </div>
      </Panel>
    </div>
  );
}

function ExpiryChart({ data }){
  const [on,setOn]=React.useState(false);
  React.useEffect(()=>{const t=setTimeout(()=>setOn(true),50);return ()=>clearTimeout(t);},[]);
  if(!data.length) return <div style={{height:230,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>No lease expiry data.</div>;
  const max=Math.max(...data.map(d=>d.sft))*1.12||1;
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:6,height:230,paddingTop:8}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:7,height:'100%',justifyContent:'flex-end'}}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${d.q}</span></div><b>${d.sft.toLocaleString('en-IN')} sft</b>`,e.clientX,e.clientY)}
          onMouseLeave={hideTip}>
          {d.sft>0 && <span className="mono tnum" style={{fontSize:9.5,color:'var(--ink-2)'}}>{(d.sft/1000).toFixed(0)}K</span>}
          <div style={{width:'100%',maxWidth:30,height:on?`${d.sft/max*100}%`:'0%',minHeight:d.sft>0?2:0,
            background:'var(--brand-maroon)',
            borderRadius:'4px 4px 0 0',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.04}s`,cursor:'default'}}/>
          <span className="mono" style={{fontSize:8.5,color:'var(--ink-3)',transform:'rotate(-35deg)',whiteSpace:'nowrap',height:14}}>{d.q}</span>
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { StackSection, TenantSection });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Approvals + Compliance Register
   ===================================================================== */

/* ============================ APPROVALS ============================ */
function ApprovalSection({ asset }){
  const D = window.DASH;
  const aId = asset;
  const A = (D.approvals&&D.approvals[aId]) || {asset:aId,asOf:null,rows:[],summary:{complied:0,revisionRequired:0}};
  const total = A.summary.complied + A.summary.revisionRequired;
  const compliedPct = total ? A.summary.complied/total*100 : 0;
  const revisionPct = total ? A.summary.revisionRequired/total*100 : 0;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
        <Kpi label="Total Approvals" value={total} accent="var(--brand-maroon)" icon="approval" foot={A.asOf ? `${A.asset} · as of ${A.asOf}` : A.asset}/>
        <Kpi label="Complied" value={A.summary.complied} accent="var(--ok)" foot={`${Math.round(compliedPct)}% of approvals`}/>
        <Kpi label="Revision Required" value={A.summary.revisionRequired} accent="var(--danger)" foot="action needed"/>
        <div className="kpi" style={{"--accent":"var(--brand-orange)"}}>
          <div className="kpi-label">Compliance Health</div>
          <div style={{marginTop:14,height:12,borderRadius:6,background:'var(--surface-3)',overflow:'hidden',display:'flex'}}>
            <div style={{width:`${compliedPct}%`,background:'var(--ok)'}}></div>
            <div style={{width:`${revisionPct}%`,background:'var(--danger)'}}></div>
          </div>
          <div className="kpi-foot" style={{justifyContent:'space-between'}}>
            <span style={{color:'var(--ok)',fontWeight:600}}>{A.summary.complied} ok</span>
            <span style={{color:'var(--danger)',fontWeight:600}}>{A.summary.revisionRequired} flagged</span>
          </div>
        </div>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Approval Register</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            columns={[
              {key:'desc',label:'Approval Description',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'authority',label:'Issuing Authority',render:v=><span style={{color:'var(--ink-2)',fontSize:12}}>{v}</span>},
              {key:'issued',label:'Issued',render:v=><span className="mono" style={{fontSize:11}}>{v}</span>},
              {key:'validity',label:'Validity',render:v=><span className="mono" style={{fontSize:11,color:v==='Not Applicable'?'var(--ink-3)':'var(--ink)'}}>{v}</span>},
              {key:'risk',label:'Risk',render:v=><Badge>{v}</Badge>},
              {key:'status',label:'Status',render:v=><Badge>{v}</Badge>},
            ]}
            rows={A.rows}
          />
        </div>
      </Panel>
    </div>
  );
}

/* ============================ COMPLIANCE REGISTER ============================ */
function ComplianceSection({ asset }){
  const D = window.DASH;
  const aId = asset;
  const C = (D.compliance&&D.compliance[aId]) || {asset:aId,asOf:null,rows:[],summary:{inProgress:0,dueSoon:0,ok:0,notDue:0,na:0}};
  const s = C.summary;
  const cards = [
    { label:'In Progress', value:s.inProgress, color:'var(--info)', kind:'info' },
    { label:'Due Soon', value:s.dueSoon, color:'var(--warn)', kind:'warn' },
    { label:'OK', value:s.ok, color:'var(--ok)', kind:'ok' },
    { label:'Not Due', value:s.notDue, color:'var(--ink-3)', kind:'muted' },
    { label:'Not Applicable', value:s.na, color:'var(--ink-3)', kind:'muted' },
  ];
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(5,1fr)'}}>
        {cards.map((c,i)=>(
          <div key={i} className="kpi" style={{"--accent":c.color}}>
            <div className="kpi-label">{c.label}</div>
            <div className="kpi-value tnum">{c.value}</div>
            <div className="kpi-foot"><Badge kind={c.kind}>{c.label}</Badge></div>
          </div>
        ))}
      </div>

      <div className="section-label"><span className="bar"></span><h3>Compliance Register · {C.asset}{C.asOf ? ` · as of ${C.asOf}` : ''}</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            columns={[
              {key:'item',label:'Compliance Item',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'cat',label:'Category',render:v=><span style={{fontSize:12,color:'var(--ink-2)'}}>{v}</span>},
              {key:'freq',label:'Frequency',render:v=><span className="mono" style={{fontSize:11}}>{v}</span>},
              {key:'due',label:'Due Date',render:v=><span className="mono" style={{fontSize:11}}>{v}</span>},
              {key:'who',label:'Responsible',render:v=><span style={{fontSize:12}}>{v}</span>},
              {key:'risk',label:'Consequence of Non-Compliance',render:v=><span style={{fontSize:11.5,color:'var(--ink-2)'}}>{v}</span>},
              {key:'rag',label:'RAG Status',render:v=><Badge>{v}</Badge>},
            ]}
            rows={C.rows}
          />
        </div>
      </Panel>
    </div>
  );
}

Object.assign(window, { ApprovalSection, ComplianceSection });

</script>

<script type="text/babel">
/* =====================================================================
   APP — top-tab navigation, page header, theme + asset filter
   ===================================================================== */
const NAV = [
  { id:'invest',     tab:'Investment',  title:'Investment Summary',     kicker:'Portfolio Performance', comp:'InvestmentSection' },
  { id:'exec',       tab:'Executive',   title:'Executive Summary',      kicker:'Asset Overview',        comp:'ExecutiveSection' },
  { id:'finance',    tab:'Financial',   title:'Financial Summary',      kicker:'Cash & Treasury',       comp:'FinancialSection' },
  { id:'expense',    tab:'Expenses',    title:'Expense vs Collection',  kicker:'Cost & Recovery',       comp:'ExpenseSection' },
  { id:'stack',      tab:'Stack Plan',  title:'Stack Plan',             kicker:'Space & Occupancy',     comp:'StackSection' },
  { id:'tenant',     tab:'Tenants',     title:'Tenant Profile',         kicker:'Tenancy',               comp:'TenantSection' },
  { id:'approval',   tab:'Approvals',   title:'Approval Summary',       kicker:'Statutory Approvals',   comp:'ApprovalSection' },
  { id:'compliance', tab:'Compliance',  title:'Compliance Register',    kicker:'Compliance',            comp:'ComplianceSection' },
];

function App(){
  const [active,setActive] = React.useState(()=>localStorage.getItem('dash_nav')||'invest');
  const [asset,setAsset]   = React.useState(()=>{
    const ids = (window.DASH.assets||[]).map(a=>a.id);
    const saved = localStorage.getItem('dash_asset');
    return ids.includes(saved) ? saved : (ids[0]||null);
  });
  const [theme,setTheme]   = React.useState(()=>localStorage.getItem('dash_theme')||'light');

  React.useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); localStorage.setItem('dash_theme',theme); },[theme]);
  React.useEffect(()=>{ localStorage.setItem('dash_nav',active); window.hideTip&&window.hideTip(); window.scrollTo(0,0); },[active]);
  React.useEffect(()=>{ localStorage.setItem('dash_asset',asset); },[asset]);

  const cur = NAV.find(n=>n.id===active) || NAV[0];
  const SectionComp = window[cur.comp];
  const D = window.DASH;

  return (
    <div className="frame">
      <TopBar assets={D.assets} asset={asset} onAsset={setAsset} theme={theme} onTheme={setTheme} month={D.meta.reportMonth} nav={NAV} active={active} onNav={setActive}/>
      <div className="content">
        <PageHead kicker={cur.kicker} title={cur.title} asset={asset} assets={D.assets} month={D.meta.reportMonth}/>
        {SectionComp ? <SectionComp asset={asset} key={active+asset+theme}/> : <div>Section not found</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
