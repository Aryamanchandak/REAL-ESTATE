}

function FundAssetCards({ month }){
  const D = window.DASH;
  return (
    <Panel title={D.meta.fund} sub={`${D.assets.length} assets · ${monthLabelOf(month)}`}>
      <div className="asset-cards">
        {D.assets.map(a=>{ const r=monthRow(a.id,month)||{}; return (
          <div key={a.id} className="asset-card">
            <AssetChip id={a.id}/>
            <div className="muted" style={{fontSize:12,marginTop:5}}>{dash(a.address)}</div>
            <div className="tnum" style={{fontSize:12.5,marginTop:10,color:'var(--ink-2)',lineHeight:1.6}}>
              {fmtSft(r.leasable)} sft · {fmtFixed(r.occupancy,1,'%')} leased<br/>{fmtCr(r.monthlyRent)} rent · WALE {fmtFixed((D.tenants[a.id]||{}).wale,2)} yrs
            </div>
            {a.mapLinkUrl && <a className="link" style={{display:'inline-block',marginTop:10}} href={a.mapLinkUrl} target="_blank" rel="noopener noreferrer">Open in Maps ↗</a>}
          </div>
        ); })}
      </div>
    </Panel>
  );
}

function AssetSection({ asset, month }){
  const D = window.DASH;
  const isFund = asset===FUND;
  const A = D.assets.find(a=>a.id===asset) || {};
  const R = monthRow(asset, month) || {};
  const S = seriesOf(asset);
  const T = D.tenants[asset] || {topTenants:[]};
  const label = monthLabelOf(month);
  const collEff = collectionEfficiency(R);
  const psfRows = S.filter(r=>!isBlank(r.psf));
  const billedRows = S.filter(r=>!isBlank(r.rentToBeBilled)||!isBlank(r.actualBilled));
  const psfFoot = isFund && R.psfExcluded && R.psfExcluded.length
    ? `excludes ${R.psfExcluded.map(assetName).join(', ')} (blank)`
    : `weighted average · ${label}`;

  return (
    <div className="fade-in">
      {isFund ? <FundAssetCards month={month}/> : <AssetProfile asset={A} row={R} wale={T.wale}/>}

      <div className="grid" style={{gridTemplateColumns:'repeat(5,minmax(0,1fr))',marginTop:18}}>
        <Kpi label="Occupancy" value={fmtFixed(R.occupancy,1)} unit="%" foot={`${fmtSft(R.leased)} of ${fmtSft(R.leasable)} sft`}/>
        <Kpi label="Avg Rent PSF" value={isBlank(R.psf)?'—':'₹'+fmtFixed(R.psf,1)} unit={isBlank(R.psf)?'':'/sf'} foot={isBlank(R.psf)?`not entered for ${label}`:psfFoot}/>
        <Kpi label="Gross Billing" value={fmtCr(R.grossBilling)} foot={`rent ${fmtCr(R.monthlyRent)} + CAM ${fmtCr(R.monthlyCam)}`}/>
        <Kpi label="Collections" value={fmtCr(R.collections)} foot={`rent ${fmtCr(R.rentalCollections)} · CAM ${fmtCr(R.camCollections)} · other ${fmtCr(R.otherCollections)}`}/>
        <Kpi label="Collection Efficiency" value={collEff==null?'—':collEff.toFixed(0)} unit={collEff==null?'':'%'} foot="rent + CAM collections ÷ gross billing"/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1.4fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Gross Billing vs Collections" sub="₹Cr · by month">
          <VBars data={S} series={[{key:'grossBilling',name:'Gross Billing',color:'var(--brand-maroon)'},{key:'collections',name:'Collections Inflow',color:'var(--brand-orange)'}]}/>
        </Panel>
        <Panel title="Top Tenants" sub="by monthly rent · ₹Cr">
          {T.topTenants.length
            ? <HBars data={T.topTenants.slice(0,8).map(t=>({name:t.name,value:t.rent}))}/>
            : <Empty>No tenants recorded in 4_TENANT_STACK_LEASE for this asset.</Empty>}
        </Panel>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1.4fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Average Rent PSF" sub="₹/sf · weighted average by month">
          {psfRows.length
            ? <LineChart data={psfRows} xKey="label" series={[{key:'psf',name:'Avg Rent ₹/sf',color:'var(--brand-orange)'}]} unit="psf"/>
            : <Empty>Rent PSF has not been entered for this asset.</Empty>}
        </Panel>
        <OccupancyPanel row={R} sub={`sq.ft · ${label}`}/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Rent to be Billed vs Actual Billed" sub="₹Cr · without tax">
          {billedRows.length
            ? <VBars data={S} series={[{key:'rentToBeBilled',name:'Rent to be Billed',color:'var(--brand-maroon)'},{key:'actualBilled',name:'Actual Billed',color:'var(--brand-orange)'}]}/>
            : <Empty height={120}>Rent to be Billed and Actual Billed are blank in 2_MONTHLY_INPUT for every reported month.</Empty>}
        </Panel>
      </div>
    </div>
  );
}

Object.assign(window, { PortfolioSection, AssetSection, AnnualTable });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Financial Summary + Expense vs Collection
   ===================================================================== */

const SOURCE_LINES = [
  ['Rental Collections','rentalCollections'], ['CAM Collections','camCollections'], ['Other Collections','otherCollections'],
  ['Redemption of FD','redemptionFd'], ['Other Inflow','otherInflow'],
];
const USAGE_LINES = [
  ['Statutory Payments (TDS/GST)','statutory'], ['CAM Expense','camExpense'], ['Debt Service','debtService'], ['OPEX','opex'],
  ['Investment in MF','investmentMf'], ['Creation of FD','creationFd'], ['Capex','capex'], ['Other Outflow','otherOutflow'], ['Bank Charges','bankCharges'],
];
const EXPENSE_SERIES = [
  {key:'statutory',name:'Statutory (TDS/GST)',color:'var(--d4)'},
  {key:'camExpense',name:'CAM',color:'var(--d2)'},
  {key:'debtService',name:'Debt Service',color:'var(--brand-maroon)'},
  {key:'opex',name:'OPEX',color:'var(--d5)'},
];

/* ============================ FINANCIAL SUMMARY ============================ */
function FinancialSection({ asset, month }){
  const D = window.DASH;
  const isFund = asset===FUND;
  const R = monthRow(asset, month) || {};
  const S = seriesOf(asset);
  const label = monthLabelOf(month);
  const flow = [
    { label:'Opening Balance', value:R.openingBalance, kind:'open' },
    { label:'Total Inflow', value:R.totalInflow, kind:'in' },
    { label:'Total Outflow', value:R.totalOutflow, kind:'out' },
    { label:'Closing Balance', value:R.closingBalance, kind:'close' },
  ];
  const assetRows = D.assets.map(a=>({assetId:a.id, ...(monthRow(a.id,month)||{})}));
  const overdraft = isFund ? assetRows.filter(r=>r.openingSource==='Over Draft Opening Balance').map(r=>assetName(r.assetId)) : [];
  const gapAssets = isFund ? assetRows.filter(r=>num(r.outflowGap)>0).map(r=>assetName(r.assetId)) : [];

  return (
    <div className="fade-in">
      <Panel title="Cash Position" sub={`${label} · ${assetName(asset)} · ₹Cr`}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'clamp(12px,2.4vw,30px)',flexWrap:'wrap',padding:'8px 0 4px'}}>
          {flow.map((f,i)=>(
            <React.Fragment key={i}>
              <div style={{textAlign:'center',display:'flex',flexDirection:'column',gap:6,
                ...(f.kind==='close'?{padding:'10px 18px',background:'color-mix(in srgb,var(--brand-maroon) 8%,var(--surface))',border:'1px solid color-mix(in srgb,var(--brand-maroon) 30%,transparent)',borderRadius:'var(--radius)'}:{})}}>
                <div className="mono" style={{fontSize:9,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--ink-3)'}}>{f.label}</div>
                <div className="tnum" style={{fontSize:23,fontWeight:700,letterSpacing:'-.02em',lineHeight:1,
                  color: f.kind==='in'?'var(--ok)':f.kind==='out'?'var(--danger)':f.kind==='close'?'var(--brand-maroon)':'var(--ink)'}}>
                  {fmtCr(f.value)}
                </div>
              </div>
              {i<flow.length-1 && <div style={{fontSize:22,color:'var(--ink-3)',fontWeight:400,lineHeight:1}}>{i===0?'+':i===1?'−':'='}</div>}
            </React.Fragment>
          ))}
        </div>
        {R.openingSource==='Over Draft Opening Balance' && <div className="note">Opening balance for {label} comes from “Over Draft Opening Balance” — the workbook's closing-balance formula uses that column for this month.</div>}
        {overdraft.length>0 && <div className="note">Opening balance for {overdraft.join(', ')} comes from “Over Draft Opening Balance” in {label}.</div>}
        {!isBlank(R.tdsReceivable) && <div className="muted" style={{fontSize:12,marginTop:12,textAlign:'center'}}>TDS receivable: <b className="tnum" style={{color:'var(--ink-2)'}}>{fmtCr(R.tdsReceivable)}</b></div>}
      </Panel>

      <div className="grid" style={{gridTemplateColumns:'1fr 1fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Sources of Funds" sub={`₹Cr inflow · ${label}`}>
          <HBars data={SOURCE_LINES.map(([name,key])=>({name,value:R[key],color:'var(--ok)'}))}/>
          <div className="divider" style={{margin:'14px 0'}}></div>
          <div style={{display:'flex',justifyContent:'space-between'}}><span style={{fontSize:12.5,fontWeight:700}}>Total Inflow</span><span className="mono tnum" style={{fontWeight:700,color:'var(--ok)'}}>{fmtCr(R.totalInflow)}</span></div>
        </Panel>
        <Panel title="Usage of Funds" sub={`₹Cr outflow · ${label}`}>
          <HBars data={USAGE_LINES.map(([name,key])=>({name,value:R[key],color:'var(--danger)'}))}/>
          <div className="divider" style={{margin:'14px 0'}}></div>
          <div style={{display:'flex',justifyContent:'space-between'}}><span style={{fontSize:12.5,fontWeight:700}}>Total of all uses</span><span className="mono tnum" style={{fontWeight:700,color:'var(--danger)'}}>{fmtCr(R.outflowComponents)}</span></div>
          {num(R.outflowGap)>0 && <div className="note">
            The workbook's Total Outflow is {fmtCr(R.totalOutflow)}: {fmtCr(R.outflowGap)} of Investment in MF is not deducted in 2_MONTHLY_INPUT, so the Closing Balance above does not reflect it.{gapAssets.length?` Affects ${gapAssets.join(', ')}.`:''}
          </div>}
        </Panel>
      </div>

      {isFund && <>
        <div className="section-label"><span className="bar"></span><h3>Cash Position by Asset · {label}</h3></div>
        <Panel pad={false}>
          <div style={{padding:'4px'}}>
            <DataTable searchable={false} initialSort={{key:'closingBalance',dir:-1}}
              columns={[
                assetColumn,
                {key:'openingBalance',label:'Opening',num:true,render:fmtCr},
                {key:'collections',label:'Collections',num:true,render:fmtCr},
                {key:'totalInflow',label:'Total Inflow',num:true,render:fmtCr},
                {key:'totalOutflow',label:'Total Outflow',num:true,render:fmtCr},
                {key:'closingBalance',label:'Closing',num:true,render:v=><b>{fmtCr(v)}</b>},
              ]}
              rows={assetRows}
              totalRow={{assetId:'Fund',openingBalance:fmtCr(R.openingBalance),collections:fmtCr(R.collections),totalInflow:fmtCr(R.totalInflow),totalOutflow:fmtCr(R.totalOutflow),closingBalance:fmtCr(R.closingBalance)}}/>
          </div>
        </Panel>
      </>}

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Business Plan vs Actual Collections" sub="₹Cr · planned collection vs collections inflow">
          {hasAny(S,'plannedCollection')
            ? <VBars data={S} series={[{key:'plannedCollection',name:'Planned (BP)',color:'var(--d3)'},{key:'collections',name:'Actual Collections',color:'var(--brand-orange)'}]} height={260}/>
            : <Empty height={120}>Planned Collection / BP is blank in 2_MONTHLY_INPUT. The sheet's “Actual Collection / BP” column repeats the Opening Balance, so it is not charted.</Empty>}
        </Panel>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Monthly Cash Flow</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable searchable={false}
            columns={[
              {key:'label',label:'Month',render:v=><span className="mono" style={{fontWeight:600,fontSize:11.5}}>{v}</span>},
              {key:'openingBalance',label:'Opening',num:true,render:fmtCr},
              {key:'totalInflow',label:'Total Inflow',num:true,render:fmtCr},
              {key:'totalOutflow',label:'Total Outflow',num:true,render:fmtCr},
              {key:'closingBalance',label:'Closing',num:true,render:v=><b>{fmtCr(v)}</b>},
              {key:'netSurplus',label:'Net Surplus',num:true,render:fmtCr},
              {key:'investmentMf',label:'Investment in MF',num:true,render:fmtCr},
              {key:'tdsReceivable',label:'TDS Receivable',num:true,render:fmtCr},
            ]}
            rows={S}/>
        </div>
      </Panel>

      <div className="section-label"><span className="bar"></span><h3>Annual Summary · June to May</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}><AnnualTable rows={D.annual[asset]||[]}/></div>
      </Panel>
    </div>
  );
}

/* ============================ EXPENSE vs COLLECTION ============================ */
function ExpenseSection({ asset, month }){
  const S = seriesOf(asset);
  const cur = monthRow(asset, month) || {};
  const ytd = periodToDate(asset, month);
  const coll = sumKey(ytd,'collections'), exp = sumKey(ytd,'totalExpense');
  const net = (coll!=null && exp!=null) ? coll-exp : null;
  const scope = `${cur.period||''} · ${ytd.length} month${ytd.length===1?'':'s'} to ${monthLabelOf(month)}`;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))'}}>
        <Kpi label="Collections" value={fmtCr(coll)} foot={scope}/>
        <Kpi label="Total Expenses" value={fmtCr(exp)} foot="statutory + CAM + debt + OPEX"/>
        <Kpi label="Net Surplus" value={fmtCr(net)} trend={coll?Math.abs(Math.round(net/coll*100))+'%':null} trendDir={net>=0?'up':'down'} foot="collections less expenses"/>
        <Kpi label="Cost-to-Collection" value={coll?Math.round(exp/coll*100):'—'} unit={coll?'%':''} foot="expenses ÷ collections"/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Expense vs Collection" sub="₹Cr · collections vs stacked expense categories">
          <ExpenseCombo data={S}/>
        </Panel>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Monthly Expense Detail</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable searchable={false}
            columns={[
              {key:'label',label:'Month',render:v=><span className="mono" style={{fontWeight:600,fontSize:11.5}}>{v}</span>},
              {key:'collections',label:'Collections',num:true,render:fmtCr},
              ...EXPENSE_SERIES.map(s=>({key:s.key,label:s.name,num:true,render:fmtCr})),
              {key:'totalExpense',label:'Total Expense',num:true,render:v=><b>{fmtCr(v)}</b>},
              {key:'netSurplus',label:'Net Surplus',num:true,render:v=>isBlank(v)?'—':<span style={{color:v>=0?'var(--ok)':'var(--danger)'}}>{fmtCr(v)}</span>},
            ]}
            rows={S}/>
        </div>
      </Panel>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Rent to be Billed vs Actual" sub="₹Cr · without tax">
          {hasAny(S,'rentToBeBilled')||hasAny(S,'actualBilled')
            ? <LineChart data={S} xKey="label" series={[{key:'rentToBeBilled',name:'Rent to be Billed',color:'var(--brand-maroon)'},{key:'actualBilled',name:'Actual Billed',color:'var(--brand-orange)'}]} unit="cr" height={240}/>
            : <Empty height={120}>Rent to be Billed and Actual Billed are blank in 2_MONTHLY_INPUT for every reported month.</Empty>}
        </Panel>
      </div>
    </div>
  );
}

/* collections bar beside stacked expense bars, one pair per month */
function ExpenseCombo({ data }){
  const wrapRef=React.useRef(null); const [w,setW]=React.useState(800); const on=useChartReveal();
  React.useEffect(()=>{ const r=()=>wrapRef.current&&setW(wrapRef.current.clientWidth); r(); window.addEventListener('resize',r); return ()=>window.removeEventListener('resize',r); },[]);
  const series=EXPENSE_SERIES;
  if(!data.length) return <Empty height={330}>No expense data for this selection.</Empty>;
  const expTot=data.map(d=>series.reduce((a,s)=>a+num(d[s.key]),0));
  const scale=niceScale([...data.map(d=>d.collections),...expTot],{tickCount:4});
  const max=scale.max;
  const tickLabels=scale.ticks.map(fmtAxis);
  const height=330,padL=Math.max(48,Math.max(...tickLabels.map(x=>x.length))*6+20),padR=16,padT=16,padB=30;
  const plotW=Math.max(0,w-padL-padR), plotH=height-padT-padB;
  const slot=plotW/data.length;
  const barW=Math.max(0,Math.min(26, slot*0.26));
  const gap=Math.max(0,Math.min(10, slot*0.06));
  const Y=v=>padT+plotH-v/max*plotH;
  const baseY=padT+plotH;
  return (
    <div ref={wrapRef}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{display:'block',overflow:'visible'}}>
        {scale.ticks.map((v,i)=>{ const y=Y(v);
          return <g key={i}><line x1={padL} x2={w-padR} y1={y} y2={y} stroke="var(--grid)"/><text x={padL-8} y={y+3} fontSize="9.5" fill="var(--ink-3)" fontFamily="var(--mono)" textAnchor="end">{'₹'+fmtAxis(v)}</text></g>; })}
        {data.map((d,i)=>{ const cx=padL + slot*i + slot/2; const tot=expTot[i]; let acc=0;
          const collX=cx-barW-gap/2, expX=cx+gap/2;
          const tip=`<div class="tip-row"><span class="tip-k">${escHtml(d.label)}</span></div><div class="tip-row"><span class="tdot" style="background:var(--ok)"></span><span>Collections</span> <b style="margin-left:auto">${fmtCr(d.collections)}</b></div>`+series.map(s=>`<div class="tip-row"><span class="tdot" style="background:${s.color}"></span><span>${escHtml(s.name)}</span> <b style="margin-left:auto">${fmtCr(d[s.key])}</b></div>`).join('')+`<div class="tip-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.18);padding-top:4px"><span class="tip-k">Total Expense</span> <b style="margin-left:auto">${fmtCr(tot)}</b></div>`;
          return (
            <g key={i} onMouseMove={e=>showTip(tip,e.clientX,e.clientY)} onMouseLeave={hideTip} style={{cursor:'default'}}>
              <rect x={collX} y={on?Y(num(d.collections)):baseY} width={barW} height={on?baseY-Y(num(d.collections)):0} fill="var(--ok)" rx="3" style={{transition:`all .32s cubic-bezier(.2,.8,.2,1) ${i*.05}s`}}/>
              <defs><clipPath id={'ec'+i}><rect x={expX} y={Y(tot)} width={barW} height={baseY-Y(tot)} rx="3"/></clipPath></defs>
              <g clipPath={`url(#ec${i})`}>
              {series.map((s,si)=>{ const segH=num(d[s.key])/max*plotH; const y=baseY-(acc+num(d[s.key]))/max*plotH; acc+=num(d[s.key]);
                return <rect key={si} x={expX} y={on?y:baseY} width={barW} height={on?segH:0} fill={s.color} rx={0} style={{transition:`all .32s cubic-bezier(.2,.8,.2,1) ${i*.05+si*.02}s`}}/>; })}
              </g>
              <text x={cx} y={height-10} fontSize="9.5" fill="var(--ink-3)" textAnchor="middle" fontFamily="var(--mono)">{d.label}</text>
            </g>
          ); })}
      </svg>
      <div className="legend" style={{marginTop:10,paddingLeft:padL}}>
        <div className="li"><span className="sw" style={{background:'var(--ok)'}}></span>Collections</div>
        <span style={{color:'var(--ink-3)',fontSize:11}}>Expense:</span>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:s.color}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

Object.assign(window, { FinancialSection, ExpenseSection });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Stack Plan + Tenant Profile
   ===================================================================== */

/* ============================ STACK PLAN ============================ */
function StackSection({ asset }){
  return asset===FUND ? <StackOverview/> : <StackPlanAsset asset={asset}/>;
}

function StackOverview(){
  const D = window.DASH;
  const rows = D.assets.map(a=>{ const t=((D.stackPlan[a.id]||{}).totals||{}); const f=t.Fund||{}, all=t.All||{};
    return {assetId:a.id, floors:all.floors, areaK:f.areaK, vacantK:f.vacantK, units:all.units, unknownArea:all.unknownArea, leasableK:a.leasable/1000}; });
  return (
    <div className="fade-in">
      <Panel title="Stacking Plans" sub="fund-held area by asset · pick an asset in the top bar for its floor-by-floor plan" pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable searchable={false}
            columns={[
              assetColumn,
              {key:'floors',label:'Floors',num:true},
              {key:'units',label:'Units',num:true},
              {key:'areaK',label:'Fund Area (K sft)',num:true,render:v=>fmtFixed(v,1)},
              {key:'leasableK',label:'Leasable (K sft)',num:true,render:v=>fmtFixed(v,1)},
              {key:'vacantK',label:'Vacant (K sft)',num:true,render:v=>fmtFixed(v,1)},
              {key:'unknownArea',label:'Units without area',num:true},
            ]}
            rows={rows}/>
        </div>
      </Panel>
    </div>
  );
}

/* The sheet can carry the whole building, not just the fund's floors, so every
   area figure is scope-dependent: `scope` drives the KPI row and rendered units. */
function StackPlanAsset({ asset }){
  const D = window.DASH;
  const aId = asset;
  const S = (D.stackPlan&&D.stackPlan[aId]) || {asset:aId,legend:[],floors:[],totals:{}};
  const pickName = assetName(aId);
  const [hl,setHl]=React.useState(null);
  const [scope,setScope]=React.useState('Fund');
  const catColor = key => (S.legend.find(l=>l.key===key)||{}).color;
  const catLabel = key => (S.legend.find(l=>l.key===key)||{}).label || key;

  const inScope = u => scope==='All' || u.own===scope;
  const T = (S.totals && S.totals[scope==='All'?'All':'Fund']) || {areaK:0,vacantK:0,floors:0,unknownArea:0};
  const othersT = (S.totals && S.totals.Others) || {units:0};
  const hasOthers = othersT.units > 0;
  const leasableK = ((D.assets.find(a=>a.id===aId)||{}).leasable||0)/1000;

  const floors = S.floors
    .map(f=>({floor:f.floor, units:f.units.filter(inScope)}))
    .filter(f=>f.units.length>0);

  // Unknown-area units get a nominal share so the floor still draws.
  const NOMINAL_K = 12;
  const unitSpan = u => (u.kKnown && u.k>0) ? u.k : NOMINAL_K;
  const floorTotals = floors.map(f=>f.units.reduce((a,u)=>a+unitSpan(u),0));
  const maxFloor = floorTotals.length ? Math.max(...floorTotals) : 0;
  const widthPct = ft => maxFloor>0 ? Math.max(ft/maxFloor*100, 4) : 100;
  const pct = T.areaK ? Math.round(T.vacantK/T.areaK*100) : 0;

  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(4,minmax(0,1fr))'}}>
        <Kpi label="Asset" value={pickName} text/>
        <Kpi label={scope==='All'?'Building Floor Area':'Fund Floor Area'} value={fmtFixed(T.areaK,1)} unit="K sft"
             foot={scope==='All' ? 'entire building' : `vs ${fmtFixed(leasableK,1)}K sft leasable`}/>
        <Kpi label="Vacant Area" value={fmtFixed(T.vacantK,1)} unit="K sft" foot={`${pct}% of ${scope==='All'?'building':'fund'} area`}/>
        <Kpi label="Floors" value={T.floors} foot={T.unknownArea ? `${T.unknownArea} unit(s) without area` : (scope==='All'?'floors in building':'fund-held floors')}/>
      </div>

      <Panel title="Stacking Plan" sub={`${pickName} · ${scope==='All'?'entire building':'fund-held floors'}`} style={{marginTop:18}}
        right={<div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
          <div className="legend">{S.legend.map(l=>(
          <div key={l.key} className="li" style={{cursor:'pointer',opacity:hl&&hl!==l.key?.4:1}}
            onMouseEnter={()=>setHl(l.key)} onMouseLeave={()=>setHl(null)}>
            <span className="sw" style={{background:l.color}}></span>{l.label}
          </div>))}
          {scope==='All' && hasOthers && <div className="li" title="Floor held by a third party, not the fund">
            <span className="sw" style={{background:'transparent',border:'1.5px dashed var(--ink-3)'}}></span>Third-party
          </div>}
          </div>
          {hasOthers && <div className="seg">
            <button className={scope==='Fund'?'on':''} onClick={()=>setScope('Fund')}>Fund</button>
            <button className={scope==='All'?'on':''} onClick={()=>setScope('All')}>Building</button>
          </div>}
        </div>}>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {floors.length===0 && <Empty>No stack-plan rows for this asset in 4_TENANT_STACK_LEASE.</Empty>}
          {floors.map(f=>{ const ft=f.units.reduce((a,u)=>a+unitSpan(u),0);
            return (
              <div key={f.floor} style={{display:'flex',alignItems:'center',gap:14}}>
                <div style={{width:54,flexShrink:0,textAlign:'right'}}>
                  <div className="mono" style={{fontSize:9,color:'var(--ink-3)',letterSpacing:'.1em'}}>FLOOR</div>
                  <div style={{fontSize:20,fontWeight:700,lineHeight:1}} className="tnum">{f.floor}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                <div style={{width:`${widthPct(ft)}%`,display:'flex',gap:5,height:54,minWidth:0}}>
                  {f.units.map((u,i)=>{ const dim = hl && hl!==u.cat;
                    const isVacant = u.cat==='vacant';
                    const isOther  = u.own==='Others';
                    const areaTxt  = u.kKnown ? `${u.k}K sft` : 'area n/a';
                    return (
                      <div key={i}
                        onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${catColor(u.cat)||'var(--ink-3)'}"></span><span class="tip-k">${escHtml(catLabel(u.cat))}</span></div><b>${escHtml(u.t)}</b><div style="opacity:.7;margin-top:2px">${escHtml(areaTxt)} · ${isOther?'Third-party':'Fund-held'}</div>`,e.clientX,e.clientY)}
                        onMouseLeave={hideTip}
                        style={{flexGrow:unitSpan(u),flexShrink:1,flexBasis:0,minWidth:0,borderRadius:7,padding:'8px 11px',display:'flex',flexDirection:'column',justifyContent:'center',cursor:'default',
                          background: isVacant
                            ? 'repeating-linear-gradient(45deg,var(--vacant),var(--vacant) 7px,transparent 7px,transparent 14px)'
                            : (isOther ? 'transparent' : (catColor(u.cat)||'var(--ink-3)')),
                          border: isVacant ? '1px dashed var(--ink-3)'
                                : (isOther ? `1.5px dashed ${catColor(u.cat)||'var(--ink-3)'}` : 'none'),
                          color: (isVacant||isOther) ? 'var(--ink-2)' : '#fff',
                          opacity: dim?.25:(isOther?.75:1), transition:'opacity .2s', overflow:'hidden'}}>
                        <div style={{fontSize:12,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{u.t}</div>
                        <div className="mono" style={{fontSize:10,opacity:.85,whiteSpace:'nowrap'}}>{areaTxt}</div>
                      </div>
                    ); })}
                </div>
              </div>
              </div>
            ); })}
        </div>
      </Panel>
    </div>
  );
}

/* ============================ TENANT PROFILE ============================ */
function TenantSection({ asset }){
  const D = window.DASH;
  const isFund = asset===FUND;
  const T = D.tenants[asset] || {rows:[],topTenants:[],leaseExpiry:[],count:0};
  const top0 = T.topTenants[0];
  const totalExpiry = T.leaseExpiry.reduce((a,d)=>a+d.sft,0);
  const maxExpiry = T.leaseExpiry.length ? Math.max(...T.leaseExpiry.map(d=>d.sft)) : 0;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(5,minmax(0,1fr))'}}>
        <Kpi label="Tenants" value={T.count} foot={`${fmtCr(T.totalRent)} monthly rent · ${fmtSft(T.totalArea)} sft`}/>
        <Kpi label="WALE" value={fmtFixed(T.wale,2)} unit="yrs" foot={`area-weighted · as of ${D.meta.asOf}`}/>
        <Kpi label="Top Tenant" value={top0 ? top0.name : '—'} text foot={top0 ? `${fmtCr(top0.rent)} / month` : 'No tenants on record'}/>
        <Kpi label="Expiring in 12 Months" value={fmtKsft(T.expiring12m)} unit="sft" foot={`leases ending after ${D.meta.asOf}`}/>
        <Kpi label="Missing Area" value={T.needsArea} foot={T.expiredCount ? `${T.expiredCount} lease(s) already ended` : 'tenant rows without leasable area'}/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr 1.6fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Top Tenants" sub="by monthly rent · ₹Cr">
          {T.topTenants.length
            ? <HBars data={T.topTenants.slice(0,10).map(t=>({name:t.name,value:t.rent,color:isFund?assetColorOf(t.assets[0]):undefined}))}/>
            : <Empty>No tenant data for this asset.</Empty>}
        </Panel>
        <Panel title="Upcoming Lease Expiry" sub="sq.ft by quarter of lease end date">
          <ExpiryChart data={T.leaseExpiry}/>
        </Panel>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Tenant Register</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            initialSort={{key:'monthlyRent',dir:-1}}
            columns={[
              ...(isFund?[assetColumn]:[]),
              {key:'name',label:'Tenant',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'monthlyRent',label:'Monthly Rent',num:true,render:fmtCr},
              {key:'psf',label:'Rent ₹/sf',num:true,render:v=>fmtFixed(v,1)},
              {key:'area',label:'Area (sft)',num:true,render:fmtSft},
              {key:'start',label:'Lease Start',render:v=><span className="mono" style={{fontSize:11}}>{dash(v)}</span>},
              {key:'endKey',label:'Lease End',render:(_,r)=><span className="mono" style={{fontSize:11}}>{dash(r.end)}</span>},
              {key:'remainingYears',label:'Years Left',num:true,render:v=>fmtFixed(v,1)},
              {key:'areaStatus',label:'Status',render:(v,r)=><Badge>{r.expired?'Expired':v}</Badge>},
            ]}
            rows={T.rows}
          />
        </div>
      </Panel>

      <div className="section-label"><span className="bar"></span><h3>Lease Expiry Schedule</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            searchable={false}
            columns={[
              {key:'q',label:'Quarter',noSort:true,render:v=><span className="mono" style={{fontWeight:600,fontSize:11.5}}>{v}</span>},
              {key:'sft',label:'Area Expiring (sft)',num:true,render:fmtSft},
              {key:'share',label:'Share',num:true,noSort:true,render:(_,r)=>(r.sft/(totalExpiry||1)*100).toFixed(1)+'%'},
              {key:'tenants',label:'Tenants',noSort:true,render:v=><span style={{fontSize:12,color:'var(--ink-2)'}}>{v.join(', ')}</span>},
              {key:'bar',label:'',noSort:true,render:(_,r)=><div style={{height:8,width:120,background:'var(--surface-3)',borderRadius:5,overflow:'hidden'}}><div style={{height:'100%',width:`${r.sft/(maxExpiry||1)*100}%`,background:'var(--brand-orange)',borderRadius:5}}></div></div>},
            ]}
            rows={T.leaseExpiry}
          />
        </div>
      </Panel>
    </div>
  );
}

function ExpiryChart({ data }){
  const on=useChartReveal();
  if(!data.length) return <Empty height={230}>No upcoming lease expiries.</Empty>;
  const max=niceScale(data.map(d=>d.sft)).max;
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:6,height:230,paddingTop:8}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:7,height:'100%',justifyContent:'flex-end'}}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${escHtml(d.q)}</span></div><b>${fmtSft(d.sft)} sft</b><div style="opacity:.75;margin-top:2px">${escHtml(d.tenants.join(', '))}</div>`,e.clientX,e.clientY)}
          onMouseLeave={hideTip}>
          {d.sft>0 && <span className="mono tnum" style={{fontSize:9.5,color:'var(--ink-2)'}}>{fmtKsft(d.sft)}</span>}
          <div style={{width:'100%',maxWidth:30,height:on?`${d.sft/max*100}%`:'0%',minHeight:d.sft>0?2:0,
            background:'var(--brand-maroon)',
            borderRadius:'4px 4px 0 0',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.04}s`,cursor:'default'}}/>
          <span className="mono" style={{fontSize:8.5,color:'var(--ink-3)',transform:'rotate(-35deg)',whiteSpace:'nowrap',height:14}}>{d.q}</span>
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { StackSection, TenantSection });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Approvals + Compliance Register + Data Quality
   ===================================================================== */

const smallText = v => <span style={{fontSize:12,color:'var(--ink-2)'}}>{dash(v)}</span>;
const monoText = v => <span className="mono" style={{fontSize:11}}>{dash(v)}</span>;

/* ============================ APPROVALS ============================ */
function ApprovalSection({ asset }){
  const D = window.DASH;
  const A = (D.approvals&&D.approvals[asset]) || {rows:[],summary:{total:0,complied:0,inProgress:0,revisionRequired:0,unclassified:0}};
  const total = A.summary.total;
  const inProgress = A.summary.inProgress || 0;
  const needsReview = (A.summary.revisionRequired || 0) + (A.summary.unclassified || 0);
  const pct = n => total ? n/total*100 : 0;
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(5,minmax(0,1fr))'}}>
        <Kpi label="Total Approvals" value={total} foot={assetName(asset)}/>
        <Kpi label="Complied" value={A.summary.complied} foot={`${Math.round(pct(A.summary.complied))}% of approvals`}/>
        <Kpi label="In Progress" value={inProgress} foot="work underway"/>
        <Kpi label="Needs Review" value={needsReview} foot="revision or missing status"/>
        <div className="kpi">
          <div className="kpi-label">Approval Health</div>
          <div style={{marginTop:14,height:12,borderRadius:6,background:'var(--surface-3)',overflow:'hidden',display:'flex'}}>
            <div style={{width:`${pct(A.summary.complied)}%`,background:'var(--ok)'}}></div>
            <div style={{width:`${pct(inProgress)}%`,background:'var(--info)'}}></div>
            <div style={{width:`${pct(needsReview)}%`,background:'var(--danger)'}}></div>
          </div>
          <div className="kpi-foot" style={{justifyContent:'space-between'}}>
            <span style={{color:'var(--ok)',fontWeight:600}}>{A.summary.complied} ok</span>
            <span style={{color:'var(--info)',fontWeight:600}}>{inProgress} active</span>
            <span style={{color:'var(--danger)',fontWeight:600}}>{needsReview} review</span>
          </div>
        </div>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Approval Register</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            columns={[
              ...(asset===FUND?[assetColumn]:[]),
              {key:'desc',label:'Approval Description',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'authority',label:'Issuing Authority',render:smallText},
              {key:'issued',label:'Issued',render:monoText},
              {key:'validity',label:'Validity',render:monoText},
              {key:'timeline',label:'Target Timeline',render:monoText},
              {key:'risk',label:'Risk',render:v=><Badge>{v}</Badge>},
              {key:'status',label:'Status',render:v=><Badge>{v}</Badge>},
              {key:'lastUpdated',label:'Last Updated',render:monoText},
              {key:'owner',label:'Owner / SPOC',render:smallText},
              {key:'remarks',label:'Remarks',render:smallText},
            ]}
            rows={A.rows}
          />
        </div>
      </Panel>
    </div>
  );
}

/* ============================ COMPLIANCE REGISTER ============================ */
function ComplianceSection({ asset }){
  const D = window.DASH;
  const C = (D.compliance&&D.compliance[asset]) || {rows:[],summary:{inProgress:0,dueSoon:0,ok:0,notDue:0,na:0,unclassified:0}};
  const s = C.summary;
  const cards = [
    { label:'In Progress', value:s.inProgress, kind:'info' },
    { label:'Due Soon', value:s.dueSoon, kind:'warn' },
    { label:'OK', value:s.ok, kind:'ok' },
    { label:'Not Due', value:s.notDue, kind:'muted' },
    { label:'Not Applicable', value:s.na, kind:'muted' },
    { label:'Unclassified', value:s.unclassified||0, kind:'danger' },
  ];
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(6,minmax(0,1fr))'}}>
        {cards.map((c,i)=>(
          <div key={i} className="kpi">
            <div className="kpi-label">{c.label}</div>
            <div className="kpi-value tnum">{c.value}</div>
            <div className="kpi-foot"><Badge kind={c.kind}>{c.label}</Badge></div>
          </div>
        ))}
      </div>

      <div className="section-label"><span className="bar"></span><h3>Compliance Register · {assetName(asset)}</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable
            columns={[
              ...(asset===FUND?[assetColumn]:[]),
              {key:'item',label:'Compliance Item',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'cat',label:'Category',render:smallText},
              {key:'freq',label:'Frequency',render:monoText},
              {key:'due',label:'Due Date',render:monoText},
              {key:'filed',label:'Date Filed',render:monoText},
              {key:'who',label:'Responsible',render:smallText},
              {key:'risk',label:'Consequence of Non-Compliance',render:smallText},
              {key:'rag',label:'RAG Status',render:v=><Badge>{v}</Badge>},
              {key:'lastUpdated',label:'Last Updated',render:monoText},
              {key:'owner',label:'Owner / SPOC',render:smallText},
              {key:'remarks',label:'Remarks',render:smallText},
            ]}
            rows={C.rows}
          />
        </div>
      </Panel>
    </div>
  );
}

/* ============================ DATA QUALITY ============================ */
function DataQualitySection(){
  const Q = window.DASH.dataQuality || {checks:[],warnings:[]};
  const pending = Q.checks.filter(c=>c.status && c.status!=='OK');
  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(3,minmax(0,1fr))'}}>
        <div className="kpi">
          <div className="kpi-label">Workbook Status</div>
          <div style={{marginTop:16}}><Badge>{Q.overall}</Badge></div>
          <div className="kpi-foot">overall status from DATA_QUALITY_CHECKS</div>
        </div>
        <Kpi label="Checks Needing Action" value={pending.length} unit={`of ${Q.checks.length}`} foot="resolve before publishing"/>
        <Kpi label="Reconciliation Notes" value={Q.warnings.length} foot="found while building this dashboard"/>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Workbook Checks</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <DataTable searchable={false}
            columns={[
              {key:'check',label:'Check',render:v=><span style={{fontWeight:600}}>{v}</span>},
              {key:'status',label:'Status',render:v=><Badge>{v}</Badge>},
              {key:'outstanding',label:'Records',num:true},
              {key:'action',label:'Action',render:smallText},
            ]}
            rows={Q.checks}/>
        </div>
      </Panel>

      <div className="section-label"><span className="bar"></span><h3>How the Dashboard Reconciled the Workbook</h3></div>
      <Panel>
        {Q.warnings.length
          ? <ul className="warn-list">{Q.warnings.map((w,i)=><li key={i}>{w}</li>)}</ul>
          : <Empty height={80}>No reconciliation issues found.</Empty>}
      </Panel>
    </div>
  );
}

Object.assign(window, { ApprovalSection, ComplianceSection, DataQualitySection });

</script>

<script type="text/babel">
/* =====================================================================
   APP — top-tab navigation, page header, theme + asset + month filters
   ===================================================================== */
const NAV = [
  { id:'portfolio',  tab:'Portfolio',      title:'Portfolio Summary',      kicker:'Fund Performance',      comp:'PortfolioSection',   scope:['month'] },
  { id:'asset',      tab:'Asset Overview', title:'Asset Overview',         kicker:'Location & Performance',comp:'AssetSection',       scope:['asset','month'] },
  { id:'finance',    tab:'Financial',      title:'Financial Summary',      kicker:'Cash & Treasury',       comp:'FinancialSection',   scope:['asset','month'] },
  { id:'expense',    tab:'Expenses',       title:'Expense vs Collection',  kicker:'Cost & Recovery',       comp:'ExpenseSection',     scope:['asset','month'] },
  { id:'stack',      tab:'Stack Plan',     title:'Stack Plan',             kicker:'Space & Occupancy',     comp:'StackSection',       scope:['asset'] },
  { id:'tenant',     tab:'Tenants',        title:'Tenant Profile',         kicker:'Tenancy',               comp:'TenantSection',      scope:['asset'] },
  { id:'approval',   tab:'Approvals',      title:'Approval Summary',       kicker:'Statutory Approvals',   comp:'ApprovalSection',    scope:['asset'] },
  { id:'compliance', tab:'Compliance',     title:'Compliance Register',    kicker:'Compliance',            comp:'ComplianceSection',  scope:['asset'] },
  { id:'quality',    tab:'Data Quality',   title:'Data Quality',           kicker:'Workbook Checks',       comp:'DataQualitySection', scope:[] },
];

function App(){
  const D = window.DASH;
  const storageGet = key => { try { return localStorage.getItem(key); } catch (_) { return null; } };
  const storageSet = (key,value) => { try { localStorage.setItem(key,value); } catch (_) {} };
  const pick = (saved, allowed, fallback) => allowed.includes(saved) ? saved : fallback;

  const [active,setActive] = React.useState(()=>pick(storageGet('dash_nav'), NAV.map(n=>n.id), NAV[0].id));
  const [asset,setAsset]   = React.useState(()=>pick(storageGet('dash_asset'), [FUND, ...D.assets.map(a=>a.id)], FUND));
  // The latest reported month is the default on every open, so a new build is never hidden behind a stale choice.
  const [month,setMonth]   = React.useState(D.meta.reportMonth);
  const [theme,setTheme]   = React.useState(()=>storageGet('dash_theme')||'light');

  React.useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); storageSet('dash_theme',theme); },[theme]);
  React.useEffect(()=>{ storageSet('dash_nav',active); window.hideTip&&window.hideTip(); window.scrollTo(0,0); },[active]);
  React.useEffect(()=>{ storageSet('dash_asset',asset); },[asset]);

  const cur = NAV.find(n=>n.id===active) || NAV[0];
  const SectionComp = window[cur.comp];
  const context = [
    cur.scope.includes('asset') ? assetName(asset) : (cur.scope.length ? D.meta.fund : null),
    cur.scope.includes('month') ? monthLabelOf(month) : `as of ${D.meta.asOf}`,
  ].filter(Boolean).join(' · ');

  return (
    <div className="frame">
      <TopBar asset={asset} onAsset={setAsset} month={month} onMonth={setMonth} theme={theme} onTheme={setTheme} nav={NAV} active={active} onNav={setActive}/>
      <div className="content">
        <PageHead kicker={cur.kicker} title={cur.title} context={context}/>
        {SectionComp ? <SectionComp asset={asset} month={month} key={active+asset+month+theme}/> : <div>Section not found</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
