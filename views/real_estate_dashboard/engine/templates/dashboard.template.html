<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICICI Prudential — Real Estate Fund Dashboard</title>
<style>
/* =====================================================================
   IPRU REAL ESTATE FUND — EXECUTIVE DASHBOARD
   Boardroom design system · warm neutral + gold · Playfair / Inter
   =================================== ================================== */

@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  /* Primary chart/data tokens
     --brand-maroon = INK (charcoal primary) · --brand-orange = GOLD accent
     (names kept so components inherit the palette without churn) */
  --brand-maroon:   #E34234;   /* vermilion — primary series */
  --brand-maroon-d: #C0392B;
  --brand-orange:   #B8960C;   /* muted gold — single accent   */
  --brand-orange-d: #9C7E08;

  /* Per-asset colours are assigned dynamically in build_dashboard.py
     (ASSET_PALETTE → window.DASH.assetColors), not via CSS variables. */

  /* Data ramp — charcoal → gold → warm greys (two-tone discipline) */
  --d1: #17181C;   /* ink        */
  --d2: #B8960C;   /* gold       */
  --d3: #8C8678;   /* warm grey  */
  --d4: #C2BCAD;   /* light grey */
  --d5: #56524A;   /* dark grey  */
  --d6: #D0AE3A;   /* light gold */

  /* Status — muted, sophisticated traffic lights */
  --ok:      #4F7A52;
  --warn:    #B8860B;
  --danger:  #AE4A3C;
  --info:    #4E6577;

  --radius:   5px;
  --radius-s: 4px;
  --radius-l: 6px;

  --font:  "Inter", system-ui, -apple-system, sans-serif;
  --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  --mono:  "Inter", system-ui, sans-serif;   /* labels use Inter, tracked */

  --gutter: 56px;
  --maxw: 1440px;
}

/* ---------- LIGHT (warm boardroom) — default ---------- */
:root, [data-theme="light"]{
  --bg:        #F4F2EC;
  --bg-grad-a: #F6F4EE;
  --bg-grad-b: #EFEDE5;
  --surface:   #FCFBF8;
  --surface-2: #F4F2EB;
  --surface-3: #EDEAE1;
  --ink:       #17181C;
  --ink-2:     #5C584E;
  --ink-3:     #948F82;
  --line:      #E2DDD1;
  --line-2:    #ECE8DE;
  --vacant:    #E0DBCE;
  --cat-outsourcing: #E34234;
  --shadow:    none;
  --shadow-lg: 0 1px 2px rgba(30,25,15,.08), 0 18px 44px rgba(30,25,15,.12);
  --grid:      rgba(60,55,40,.10);
  --appbar-bg: rgba(252,251,248,.86);
}

/* ---------- DARK (charcoal command) ---------- */
[data-theme="dark"]{
  --bg:        #15171E;
  --bg-grad-a: #181B23;
  --bg-grad-b: #131520;
  --surface:   #16181F;
  --surface-2: #1B1E26;
  --surface-3: #22252F;
  --ink:       #F2F0E8;
  --ink-2:     #C9C4B6;
  --ink-3:     #948E7F;
  --line:      rgba(255,255,255,.09);
  --line-2:    rgba(255,255,255,.05);
  --vacant:    #2A2D36;
  --cat-outsourcing: #5E6373;
  --shadow:    none;
  --shadow-lg: 0 2px 8px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
  --grid:      rgba(255,250,235,.07);
  --appbar-bg: rgba(15,17,23,.82);
  --brand-maroon: #DAD5C8;   /* light ink for bars on dark */
  --brand-orange: #C9A52A;   /* brighter gold */
  --d1: #E2DDD0;
  --d3: #8C8678;
  --d4: #5E5A50;
  --d5: #B4AE9F;
}

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}
#root{ min-height:100%; }
/* dark mode: light-on-dark text reads thin — nudge body weight up a step for legibility */
[data-theme="dark"] body{ font-weight:500; }
::selection{ background:color-mix(in srgb, var(--brand-orange) 26%, transparent); }

*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-thumb{ background:color-mix(in srgb,var(--ink-3) 38%, transparent); border-radius:20px; border:3px solid transparent; background-clip:padding-box; }
*::-webkit-scrollbar-track{ background:transparent; }

.mono{ font-family:var(--mono); }
.serif{ font-family:var(--serif); }
.tnum{ font-variant-numeric:tabular-nums; }
.uplabel{ text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:500; color:var(--ink-3); }

/* ============ APP FRAME ============ */
.frame{ min-height:100vh; display:flex; flex-direction:column; }

.masthead{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:stretch;
  background:var(--appbar-bg); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.masthead-brand{
  display:flex; align-items:center; flex-shrink:0;
  padding:8px 40px 8px var(--gutter);
  border-right:1px solid var(--line);
}
.brand-logo{ height:90px; width:auto; display:block; border-radius:6px; flex-shrink:0; }
[data-theme="dark"] .brand-logo{ box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 1px 6px rgba(0,0,0,.35); }
.masthead-bars{ flex:1; display:flex; flex-direction:column; min-width:0; }

/* top control row */
.appbar-row{
  display:flex; align-items:center; gap:24px;
  padding:0 var(--gutter); height:64px;
  border-bottom:1px solid var(--line);
}
.wm-sub{ font-size:13px; font-weight:500; color:var(--ink-2); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.appbar-spacer{ flex:1; }

/* tab navigation (PDF-style) — centered */
.tabbar{
  flex:1; display:flex; align-items:center; justify-content:center;
  gap:2px; padding:0 var(--gutter); overflow-x:auto;
}
.tabbar::-webkit-scrollbar{ height:0; }
.tab{
  position:relative; border:none; background:none; cursor:pointer;
  padding:15px 18px 14px; font-family:var(--font); font-size:13px; font-weight:500;
  letter-spacing:.02em; color:var(--ink-2); white-space:nowrap; transition:color .18s;
}
.tab:hover{ color:var(--ink); }
.tab.active{ color:var(--ink); }
.tab.active::after{ content:""; position:absolute; left:18px; right:18px; bottom:-1px; height:2px; background:var(--brand-orange); }

/* right-side controls */
.ctrl-row{ display:flex; align-items:center; gap:14px; }
.month-tag{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:500; }

.seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius-s); overflow:hidden; }
.seg button{ border:none; background:none; font-family:var(--font); font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:7px 12px; cursor:pointer; transition:.16s; }
.seg button:hover{ color:var(--ink); }
.seg button.on{ background:var(--ink); color:var(--surface); }

.pill-select{ position:relative; }
.pill{ display:flex; align-items:center; gap:9px; background:transparent; border:1px solid var(--line); border-radius:var(--radius-s); padding:7px 12px; cursor:pointer; font-family:var(--font); font-size:12.5px; font-weight:500; color:var(--ink); transition:.16s; }
.pill-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px; }
.pill:focus-visible,.seg button:focus-visible,.tab:focus-visible,.link:focus-visible{ outline:2px solid var(--brand-orange); outline-offset:2px; }
.pill:hover{ border-color:var(--ink-3); }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

.dropdown{ position:absolute; top:calc(100% + 8px); right:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:5px; min-width:210px; z-index:60; }
.dd-item{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:var(--radius-s); cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink); }
.dd-item:hover{ background:var(--surface-3); }
.dd-item .chk{ margin-left:auto; color:var(--brand-orange); font-size:11px; }

/* ============ CONTENT ============ */
.content{ flex:1; padding:40px var(--gutter) 80px; max-width:var(--maxw); width:100%; margin:0 auto; }

.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:34px; flex-wrap:wrap; }
.page-kicker{ text-transform:uppercase; letter-spacing:.18em; font-size:11.5px; font-weight:500; color:var(--brand-orange); margin-bottom:11px; }
.page-title{ font-family:var(--serif); font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1; }
.page-meta{ text-align:right; font-size:12px; color:var(--ink-2); line-height:1.6; }
.page-meta b{ color:var(--ink); font-weight:600; }

/* ============ GRID / PANELS ============ */
.grid{ display:grid; gap:22px; }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.panel-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 24px 0; }
.panel-title{ font-family:var(--serif); font-size:17px; font-weight:600; letter-spacing:-.01em; }
.panel-sub{ text-transform:uppercase; letter-spacing:.12em; font-size:10.5px; font-weight:500; color:var(--ink-3); margin-top:7px; }
.panel-body{ padding:20px 24px 24px; }

.section-label{ display:flex; align-items:center; gap:11px; margin:38px 0 16px; }
.section-label .bar{ width:18px; height:2px; background:var(--brand-orange); }
.section-label h3{ margin:0; text-transform:uppercase; letter-spacing:.16em; font-size:11px; color:var(--ink-2); font-weight:600; }

/* ============ KPI ============ */
.kpi{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 22px 20px; }
.kpi-label{ text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:500; color:var(--ink-3); display:flex; align-items:center; gap:7px; }
.kpi-value{ font-family:var(--serif); font-size:clamp(24px,2.1vw,33px); font-weight:600; letter-spacing:-.02em; margin-top:14px; line-height:1; white-space:nowrap; }
.kpi-value .unit{ font-size:.46em; font-weight:500; color:var(--ink-2); margin-left:3px; font-family:var(--font); }
.kpi-value.kpi-text{ font-size:18px; white-space:normal; line-height:1.25; }
.kpi-foot{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-2); font-size:12.5px; color:var(--ink-2); display:flex; align-items:center; gap:7px; }
.trend{ font-weight:600; font-size:11.5px; display:inline-flex; align-items:center; gap:3px; }
.trend.up{ color:var(--ok); }
.trend.down{ color:var(--danger); }

/* ============ TABLES ============ */
.tbl-wrap{ overflow-x:auto; }
table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
table.tbl th{ text-align:left; text-transform:uppercase; letter-spacing:.1em; font-size:10.5px; color:var(--ink-3); font-weight:600; padding:11px 16px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none; }
table.tbl th.no-sort{ cursor:default; }
table.tbl th .sort-ar{ opacity:.35; margin-left:5px; font-size:8px; }
table.tbl th.sorted .sort-ar{ opacity:1; color:var(--brand-orange); }
table.tbl td{ padding:13px 16px; border-bottom:1px solid var(--line-2); color:var(--ink); vertical-align:middle; }
table.tbl tbody tr{ transition:background .14s; }
table.tbl tbody tr:hover{ background:var(--surface-2); }
table.tbl td.num{ text-align:right; font-variant-numeric:tabular-nums; }
table.tbl th.num{ text-align:right; }
table.tbl tr.total-row td{ font-weight:600; border-top:1px solid var(--line); border-bottom:none; }

/* badges */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:var(--radius-s); white-space:nowrap; }
.badge .bdot{ width:5px; height:5px; border-radius:50%; }
.badge.ok{ background:color-mix(in srgb,var(--ok) 13%,transparent); color:var(--ok); }
.badge.warn{ background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
.badge.danger{ background:color-mix(in srgb,var(--danger) 13%,transparent); color:var(--danger); }
.badge.info{ background:color-mix(in srgb,var(--info) 13%,transparent); color:var(--info); }
.badge.muted{ background:var(--surface-3); color:var(--ink-3); }

.achip{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:500; white-space:nowrap; }
.achip .dot{ width:8px; height:8px; border-radius:2px; }

.search{ display:flex; align-items:center; gap:8px; background:transparent; border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 12px; }
.search input{ border:none; background:none; outline:none; font-family:var(--font); font-size:12.5px; color:var(--ink); width:180px; }
.search input::placeholder{ color:var(--ink-3); }

/* tooltip */
.chart-tip{ position:fixed; pointer-events:none; z-index:200; background:var(--ink); color:var(--bg); border-radius:var(--radius-s); padding:10px 12px; font-size:11.5px; box-shadow:var(--shadow-lg); transform:translate(-50%,-118%); white-space:nowrap; opacity:0; transition:opacity .12s; }
[data-theme="dark"] .chart-tip{ border:1px solid var(--line); }
.chart-tip .tip-row{ display:flex; align-items:center; gap:8px; }
.chart-tip .tip-k{ text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; opacity:.65; }
.chart-tip b{ font-variant-numeric:tabular-nums; }
.chart-tip .tdot{ width:7px;height:7px;border-radius:2px; }

.legend{ display:flex; flex-wrap:wrap; gap:16px; }
.legend .li{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-2); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
.legend .li .sw{ width:10px; height:10px; border-radius:2px; }

.fade-in{ opacity:1; }
.muted{ color:var(--ink-3); }
.divider{ height:1px; background:var(--line); margin:0; border:none; }
.boot-state{ min-height:100vh; display:grid; place-items:center; padding:32px; color:var(--ink-2); text-align:center; }
.boot-state b{ color:var(--ink); }

.empty{ display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-3); font-size:12.5px; padding:24px 12px; line-height:1.5; }
.note{ margin-top:14px; padding:10px 12px; border:1px solid color-mix(in srgb,var(--warn) 35%,transparent); background:color-mix(in srgb,var(--warn) 8%,transparent); border-radius:var(--radius-s); font-size:12px; color:var(--ink-2); line-height:1.5; }
.stat-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 18px; }
.stat .k{ text-transform:uppercase; letter-spacing:.1em; font-size:9.5px; font-weight:500; color:var(--ink-3); }
.stat .v{ font-size:14px; font-weight:600; margin-top:4px; line-height:1.35; overflow-wrap:anywhere; }
.map-frame{ width:100%; height:260px; border:0; border-radius:var(--radius-s); display:block; background:var(--surface-2); }
.asset-img{ width:100%; height:260px; object-fit:cover; border-radius:var(--radius-s); display:block; }
.img-placeholder{ height:260px; border:1px dashed var(--line); border-radius:var(--radius-s); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--ink-3); font-size:12px; text-align:center; padding:16px; background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 8px,transparent 8px,transparent 16px); }
.link{ color:var(--ink); text-decoration:underline; text-decoration-color:var(--brand-orange); text-underline-offset:3px; font-size:12.5px; font-weight:500; white-space:nowrap; }
.asset-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.asset-card{ border:1px solid var(--line-2); border-radius:var(--radius-s); padding:14px 16px; }
.warn-list{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; font-size:12.5px; color:var(--ink-2); line-height:1.5; }

/* Inline grid definitions keep desktop layouts precise; these guarded
   overrides prevent KPI cards and charts from overflowing on smaller screens. */
@media (max-width:1100px){
  :root{ --gutter:24px; }
  .grid{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  .masthead-brand{ padding-left:24px; padding-right:24px; }
  .appbar-row,.tabbar{ padding-left:24px; padding-right:24px; }
}
@media (max-width:700px){
  :root{ --gutter:16px; }
  .masthead{ position:relative; flex-direction:column; }
  .masthead-brand{ justify-content:center; border-right:0; border-bottom:1px solid var(--line); padding:6px 16px; }
  .brand-logo{ height:64px; }
  .appbar-row{ height:auto; min-height:58px; padding:10px 16px; flex-wrap:wrap; gap:10px; }
  .wm-sub{ display:none; }
  .ctrl-row{ width:100%; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .pill{ max-width:100%; }
  .pill-text{ max-width:52vw; }
  .pill-select{ min-width:0; }
  .tabbar{ justify-content:flex-start; padding:0 8px; }
  .tab{ padding-left:12px; padding-right:12px; }
  .content{ padding-top:28px; }
  .grid{ grid-template-columns:minmax(0,1fr) !important; }
  .panel-head{ flex-direction:column; }
  .kpi-value{ white-space:normal; overflow-wrap:anywhere; }
}

</style>
</head>

<div id="root"><div class="boot-state">Loading dashboard…</div></div>
<noscript><div class="boot-state"><b>JavaScript is required to view this dashboard.</b></div></noscript>

<!-- Browser runtime is embedded by build_dashboard.py. Keeping it local makes
     the generated file work from file:// in Safari and on restricted networks. -->

<script>
window.addEventListener('load',()=>setTimeout(()=>{
  const root=document.getElementById('root');
  if(root && (!window.React || !window.ReactDOM || !window.Babel || root.querySelector('.boot-state'))){
    root.innerHTML='<div class="boot-state"><div><b>Dashboard runtime could not be initialized.</b><br/>Rebuild the dashboard and try opening it again.</div></div>';
  }
},800));
</script>

<!-- Data (plain JS, no Babel needed) -->
<script>
/* =====================================================================
   DASHBOARD DATA  —  single source of truth
   ---------------------------------------------------------------------
   This is the ONLY file your backend / Claude Code needs to populate.
   Every number rendered in the UI comes from here. Shape it from a
   dataframe, a JSON API, anything — just keep the keys the same.

   Money is stored as numbers in ₹ Crore (Cr).  Area in million sq.ft (M)
   unless a field name says otherwise (e.g. *_sft = absolute square feet).
   ===================================================================== */
window.DASH = __DASH_DATA__;

</script>

<!-- All JSX sections compiled together by Babel -->
<script type="text/babel">
/* =====================================================================
   CHART KIT — hand-built SVG charts (no external libraries)
   Components exported to window: Donut, HBars, VBars, LineChart,
   StackedBars, DistBars, MiniSpark
   ===================================================================== */
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- singleton tooltip ---------- */
function getTipEl(){
  let el = document.getElementById('__chartTip');
  if(!el){ el = document.createElement('div'); el.id='__chartTip'; el.className='chart-tip'; document.body.appendChild(el); }
  return el;
}
function showTip(html, x, y){
  const el = getTipEl();
  el.innerHTML = html; el.style.left = x+'px'; el.style.top = y+'px'; el.style.opacity = 1;
}
function hideTip(){ const el=document.getElementById('__chartTip'); if(el) el.style.opacity=0; }
window.showTip = showTip; window.hideTip = hideTip;

const num = v => Number.isFinite(Number(v)) ? Number(v) : 0;
const isBlank = v => v===null||v===undefined||v===''||!Number.isFinite(Number(v));
/* Asset-level amounts are often below ₹1Cr, so small values keep two decimals. */
const fmtCr  = v => {
  if(isBlank(v)) return '—';
  const a=Math.abs(num(v)), d=a<10?2:1;
  return (num(v)<0?'-':'') + '₹' + a.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}) + 'Cr';
};
const fmtNum = v => isBlank(v) ? '—' : num(v).toLocaleString('en-IN');
const fmtSft = v => isBlank(v) ? '—' : Math.round(num(v)).toLocaleString('en-IN');
const fmtKsft = v => isBlank(v) ? '—' : (num(v)/1000).toLocaleString('en-IN',{maximumFractionDigits:1})+'K';
const fmtFixed = (v, decimals=2, suffix='') => (v===null||v===undefined||!Number.isFinite(Number(v))) ? '—' : num(v).toFixed(decimals)+suffix;
const niceStep = raw => {
  if(!Number.isFinite(raw)||raw<=0) return 1;
  const power=Math.pow(10,Math.floor(Math.log10(raw)));
  const fraction=raw/power;
  const niceFraction=fraction<=1?1:fraction<=2?2:fraction<=5?5:10;
  return niceFraction*power;
};
const niceScale = (values,{includeZero=true,tickCount=4,padRatio=.08}={}) => {
  const finite=values.map(num).filter(Number.isFinite);
  if(!finite.length) return {min:0,max:1,ticks:[0,.25,.5,.75,1]};
  let lo=Math.min(...finite),hi=Math.max(...finite);
  if(includeZero){lo=Math.min(0,lo);hi=Math.max(0,hi);}
  if(includeZero&&lo===0&&hi===0) return {min:0,max:1,ticks:[0,.2,.4,.6,.8,1]};
  if(lo===hi){
    const delta=Math.abs(lo)*.12||1;
    lo=includeZero?Math.min(0,lo-delta):lo-delta;
    hi=hi+delta;
  }else{
    const pad=(hi-lo)*padRatio;
    if(!includeZero) lo-=pad;
    hi+=pad;
  }
  const step=niceStep((hi-lo)/tickCount);
  const min=includeZero&&lo>=0?0:Math.floor(lo/step)*step;
  const max=Math.max(min+step,Math.ceil(hi/step)*step);
  const tickLength=Math.max(2,Math.round((max-min)/step)+1);
  const ticks=Array.from({length:tickLength},(_,i)=>min+step*i);
  return {min,max,ticks};
};
const fmtAxis = v => {
  const n=num(v),a=Math.abs(n);
  if(a>=1000000) return (n/1000000).toLocaleString('en-IN',{maximumFractionDigits:1})+'M';
  if(a>=1000) return (n/1000).toLocaleString('en-IN',{maximumFractionDigits:1})+'K';
  return n.toLocaleString('en-IN',{maximumFractionDigits:a<1?2:a<10?1:0});
};
const cssVar = c => (c && c.startsWith('--')) ? `var(${c})` : c;
const escHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[ch]);
window.fmtCr = fmtCr; window.fmtNum = fmtNum; window.fmtFixed = fmtFixed; window.fmtSft = fmtSft; window.fmtKsft = fmtKsft;
window.niceScale = niceScale; window.fmtAxis = fmtAxis;

function useChartReveal(){
  const [on,setOn]=useState(false);
  useEffect(()=>{
    let raf2;
    const raf1=requestAnimationFrame(()=>{raf2=requestAnimationFrame(()=>setOn(true));});
    return ()=>{cancelAnimationFrame(raf1);if(raf2)cancelAnimationFrame(raf2);};
  },[]);
  return on;
}

/* ================= DONUT / GAUGE ================= */
function Donut({ value, label, sub, color="var(--brand-maroon)", size=168, track="var(--surface-3)", thickness=14, center }){
  const [p,setP] = useState(0);
  const safeValue=Math.max(0,Math.min(100,num(value)));
  useEffect(()=>{ let raf2; const raf1=requestAnimationFrame(()=>{ raf2=requestAnimationFrame(()=>setP(safeValue)); });
    return ()=>{ cancelAnimationFrame(raf1); cancelAnimationFrame(raf2); }; },[safeValue]);
  const r=(size-thickness)/2, c=2*Math.PI*r, off=c*(1-p/100);
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
      <div style={{position:'relative',width:size,height:size,display:'grid',placeItems:'center'}}>
        <svg width={size} height={size} style={{transform:'rotate(-90deg)',display:'block'}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={thickness}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={cssVar(color)} strokeWidth={thickness}
            strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
            style={{transition:'stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)'}}/>
        </svg>
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
          <div style={{fontSize:Math.round(size*.19),fontWeight:700,letterSpacing:'-.03em',lineHeight:1}} className="tnum">{center ?? (safeValue+'%')}</div>
          {label && <div className="mono" style={{fontSize:9.5,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--ink-3)',marginTop:5}}>{label}</div>}
        </div>
      </div>
      {sub && <div style={{fontSize:11.5,color:'var(--ink-2)',marginTop:2}}>{sub}</div>}
    </div>
  );
}

/* ================= HORIZONTAL BARS ================= */
function HBars({ data, color="var(--brand-maroon)", unit="cr", height, valFmt }){
  const on=useChartReveal();
  const {max}=niceScale(data.map(d=>d.value));
  const fmt = valFmt || (unit==='cr'?fmtCr:fmtNum);
  const dense=data.length>8;
  const gap=dense?8:13;
  const h = height ?? Math.max(170,Math.min(420,data.length*(dense?28:42)));
  return (
    <div style={{display:'flex',flexDirection:'column',gap,minHeight:h,justifyContent:'center'}}>
      {data.map((d,i)=>(
        <div key={i}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${cssVar(d.color||color)}"></span><span class="tip-k">${escHtml(d.name||d.label)}</span></div><b>${fmt(d.value)}</b>`, e.clientX, e.clientY)}
          onMouseLeave={hideTip}
          style={{cursor:'default'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
            <span style={{fontSize:12.5,fontWeight:600}}>{d.name||d.label}</span>
            <span className="mono tnum" style={{fontSize:11.5,color:'var(--ink-2)'}}>{fmt(d.value)}</span>
          </div>
          <div style={{height:9,borderRadius:5,background:'var(--surface-3)',overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:5,width:on?`${num(d.value)/max*100}%`:'0%',
              background:cssVar(d.color||color),
              transition:`width .32s cubic-bezier(.2,.8,.2,1) ${i*.06}s`}}/>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ================= VERTICAL GROUPED BARS ================= */
function VBars({ data, series, height=240, unit="cr", yTicks=4 }){
  const on=useChartReveal();
  const fmt = unit==='cr'?fmtCr:fmtNum;
  if(!data.length) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>No data available.</div>;
  const scale=niceScale(data.flatMap(d=>series.map(s=>d[s.key])),{tickCount:yTicks});
  const max=scale.max;
  const padB=26, padT=8, plotH=height-padB-padT;
  const tickLabels=scale.ticks.map(fmtAxis);
  const padL=Math.max(34,Math.max(...tickLabels.map(x=>x.length))*6+10);
  return (
    <div>
      <div style={{display:'flex',height,position:'relative'}}>
        <div style={{position:'absolute',inset:`${padT}px 0 ${padB}px 0`,display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
          {scale.ticks.slice().reverse().map((t,i)=>(<div key={i} style={{borderTop:'1px solid var(--grid)',position:'relative'}}>
            <span className="mono" style={{position:'absolute',left:0,top:-7,fontSize:9,color:'var(--ink-3)'}}>{fmtAxis(t)}</span>
          </div>))}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:0,paddingLeft:padL,position:'relative',zIndex:1}}>
          {data.map((d,i)=>(
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:4,height:plotH,width:'100%',justifyContent:'center'}}>
                {series.map((s,j)=>(
                  <div key={j}
                    onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${escHtml(d.m||d.label)}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${escHtml(ss.name)}</span> <b style="margin-left:auto">${fmt(d[ss.key])}</b></div>`).join(''), e.clientX, e.clientY)}
                    onMouseLeave={hideTip}
                    style={{ width:`min(34px, ${70/series.length}%)`, height:on?`${num(d[s.key])/max*plotH}px`:'0px',
                      background:cssVar(s.color),
                      borderRadius:'4px 4px 0 0', transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.05+j*.03}s`, cursor:'default' }}/>
                ))}
              </div>
              <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)'}}>{d.m||d.label}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="legend" style={{marginTop:12,paddingLeft:padL}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color)}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

/* ================= STACKED BARS ================= */
function StackedBars({ data, series, height=250, unit="cr" }){
  const on=useChartReveal();
  const fmt = unit==='cr'?fmtCr:fmtNum;
  const totals = data.map(d=>series.reduce((a,s)=>a+num(d[s.key]),0));
  const max=niceScale(totals).max, padB=26, plotH=height-padB;
  return (
    <div>
      <div style={{display:'flex',alignItems:'flex-end',gap:0,height}}>
        {data.map((d,i)=>{
          const tot=totals[i];
          return (
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
              <div style={{width:'min(46px,64%)',height:plotH,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
                <div style={{display:'flex',flexDirection:'column-reverse',height:on?`${tot/max*plotH}px`:'0px',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.05}s`,borderRadius:'5px 5px 2px 2px',overflow:'hidden'}}>
                  {series.map((s,j)=>(
                    <div key={j}
                      onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${escHtml(d.m||d.label)}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${escHtml(ss.name)}</span> <b style="margin-left:auto">${fmt(d[ss.key])}</b></div>`).join('')+`<div class="tip-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,.15);padding-top:4px"><span class="tip-k">Total</span> <b style="margin-left:auto">${fmt(tot)}</b></div>`, e.clientX, e.clientY)}
                      onMouseLeave={hideTip}
                      style={{height:`${tot?num(d[s.key])/tot*100:0}%`,background:cssVar(s.color),cursor:'default'}}/>
                  ))}
                </div>
              </div>
              <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)'}}>{d.m||d.label}</span>
            </div>
          );
        })}
      </div>
      <div className="legend" style={{marginTop:12}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color)}}></span>{s.name}</div>))}
      </div>
    </div>
  );
}

/* ================= LINE / AREA CHART ================= */
function LineChart({ data, series, height=240, unit="cr", yKey, xKey="m" }){
  const wrapRef=useRef(null); const [w,setW]=useState(560);
  const on=useChartReveal();
  useEffect(()=>{ const r=()=>wrapRef.current&&setW(wrapRef.current.clientWidth); r(); window.addEventListener('resize',r); return ()=>window.removeEventListener('resize',r); },[]);
  const fmt = unit==='cr'?fmtCr:(unit==='psf'?(v=>'₹'+v+'/sf'):fmtNum);
  if(!data.length) return <div style={{height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-3)'}}>No data available.</div>;
  const allVals=data.flatMap(d=>series.map(s=>num(d[s.key])));
  const scale=niceScale(allVals,{includeZero:false,tickCount:4,padRatio:.12});
  const {min,max}=scale;
  const tickLabels=scale.ticks.map(fmtAxis);
  const padL=Math.max(38,Math.max(...tickLabels.map(x=>x.length))*6+10),padR=12,padT=12,padB=26;
  const plotW=w-padL-padR, plotH=height-padT-padB;
  const X=i=>padL + (data.length<=1?plotW/2:i/(data.length-1)*plotW);
  const Y=v=>padT + plotH - (v-min)/(max-min)*plotH;
  return (
    <div ref={wrapRef} style={{position:'relative'}}>
      <svg width="100%" height={height} viewBox={`0 0 ${w} ${height}`} style={{display:'block',overflow:'visible'}}>
        {scale.ticks.map((v,i)=>{ const y=Y(v);
          return <g key={i}><line x1={padL} x2={w-padR} y1={y} y2={y} stroke="var(--grid)"/><text x={padL-7} y={y+3} fontSize="9" fill="var(--ink-3)" fontFamily="var(--mono)" textAnchor="end">{fmtAxis(v)}</text></g>; })}
        {data.map((d,i)=><text key={i} x={X(i)} y={height-8} fontSize="9.5" fill="var(--ink-3)" textAnchor="middle" fontFamily="var(--mono)">{d[xKey]}</text>)}
        {series.map((s,si)=>{
          const pts=data.map((d,i)=>[X(i),Y(num(d[s.key]))]);
          const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
          const area=`${line} L ${pts[pts.length-1][0]} ${Y(min)} L ${pts[0][0]} ${Y(min)} Z`;
          const col=cssVar(s.color);
          return (
            <g key={si}>
              {s.area!==false && <path d={area} fill={col} opacity={on?.10:0} style={{transition:'opacity .3s'}}/>}
              <path d={line} fill="none" stroke={col} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"
                style={{strokeDasharray:1400,strokeDashoffset:on?0:1400,transition:`stroke-dashoffset .6s ease ${si*.15}s`}}/>
              {pts.map((p,i)=>(
                <g key={i}>
                  <circle cx={p[0]} cy={p[1]} r="9" fill="transparent"
                    onMouseMove={e=>showTip(`<div class="tip-row"><span class="tip-k">${escHtml(data[i][xKey])}</span></div>`+series.map(ss=>`<div class="tip-row"><span class="tdot" style="background:${cssVar(ss.color)}"></span><span>${escHtml(ss.name)}</span> <b style="margin-left:auto">${fmt(data[i][ss.key])}</b></div>`).join(''), e.clientX, e.clientY)}
                    onMouseLeave={hideTip} style={{cursor:'default'}}/>
                  <circle cx={p[0]} cy={p[1]} r="3.6" fill="var(--surface)" stroke={col} strokeWidth="2.2" style={{opacity:on?1:0,transition:`opacity .4s ease ${.6+i*.05}s`,pointerEvents:'none'}}/>
                </g>
              ))}
            </g>
          );
        })}
      </svg>
      {series.length>1 && <div className="legend" style={{marginTop:6,paddingLeft:padL}}>
        {series.map((s,i)=>(<div key={i} className="li"><span className="sw" style={{background:cssVar(s.color),borderRadius:2}}></span>{s.name}</div>))}
      </div>}
    </div>
  );
}

/* ================= DISTRIBUTION BARS (rent spread) ================= */
function DistBars({ data, colors=['var(--d4)','var(--d3)','var(--brand-maroon)','var(--brand-orange)'], unit="M sft", height=210 }){
  const on=useChartReveal();
  const max=niceScale(data.map(d=>d.area)).max;
  const plotH=Math.max(80,height-62);
  return (
    <div style={{display:'flex',alignItems:'flex-end',gap:14,height,paddingTop:8}}>
      {data.map((d,i)=>(
        <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:8,height:'100%',justifyContent:'flex-end'}}
          onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${cssVar(colors[i%colors.length])}"></span><span class="tip-k">${escHtml(d.band)}</span></div><b>${d.area} ${escHtml(unit)}</b>`, e.clientX, e.clientY)}
          onMouseLeave={hideTip}>
          <span className="tnum" style={{fontSize:13,fontWeight:700}}>{d.area}</span>
          <div style={{width:'100%',maxWidth:60,height:on?`${num(d.area)/max*plotH}px`:'0px',minHeight:on&&num(d.area)>0?2:0,
            background:cssVar(colors[i%colors.length]),
            borderRadius:'4px 4px 0 0',transition:`height .32s cubic-bezier(.2,.8,.2,1) ${i*.07}s`,cursor:'default'}}/>
          <span className="mono" style={{fontSize:9.5,color:'var(--ink-3)',textAlign:'center',lineHeight:1.2}}>{d.band}</span>
        </div>
      ))}
    </div>
  );
}

Object.assign(window, { Donut, HBars, VBars, StackedBars, LineChart, DistBars });

</script>

        <TabNav nav={nav} active={active} onNav={onNav}/>
      </div>
    </header>
  );
}

/* ---------- Dropdown pill (asset + month pickers) ---------- */
function PillSelect({ items, value, onChange, label }){
  const [open,setOpen]=uS(false);
  const ref=uR(null);
  uE(()=>{
    const close=e=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    window.addEventListener('click',close);
    return ()=>window.removeEventListener('click',close);
  },[]);
  const cur = items.find(i=>i.id===value) || items[0] || {};
  return (
    <div className="pill-select" ref={ref}>
      <button type="button" className="pill" aria-label={label} aria-expanded={open} onClick={()=>setOpen(v=>!v)}>
        {cur.dot && <span className="dot" style={{background:cur.dot}}></span>}
        <span className="pill-text">{cur.name}</span>
        <span style={{fontSize:9,color:'var(--ink-3)',marginLeft:2}}>▾</span>
      </button>
      {open && (
        <div className="dropdown" role="listbox" aria-label={label}>
          {items.map(i=>(
            <div key={i.id} role="option" aria-selected={i.id===value} className="dd-item" onClick={()=>{onChange(i.id);setOpen(false);}}>
              {i.dot && <span className="dot" style={{background:i.dot}}></span>}
              {i.name}
              {i.meta && <span className="tnum" style={{marginLeft:'auto',fontSize:11,color:'var(--ink-3)',paddingLeft:12}}>{i.meta}</span>}
              {i.id===value && <span className="chk" style={i.meta?{marginLeft:8}:null}>✓</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Tab navigation ---------- */
function TabNav({ nav, active, onNav }){
  return (
    <div className="tabbar">
      {nav.map(n=>(
        <button key={n.id} className={"tab"+(active===n.id?" active":"")} onClick={()=>onNav(n.id)}>{n.tab}</button>
      ))}
    </div>
  );
}

/* ---------- Page header ---------- */
function PageHead({ kicker, title, context }){
  return (
    <div className="page-head">
      <div>
        <div className="page-kicker">{kicker}</div>
        <h1 className="page-title">{title}</h1>
      </div>
      {context && <div className="page-meta">{context}</div>}
    </div>
  );
}

/* ---------- KPI ---------- */
function Kpi({ label, value, unit, foot, trend, trendDir, text }){
  return (
    <div className="kpi">
      <div className="kpi-label">{label}</div>
      <div className={"kpi-value tnum"+(text?" kpi-text":"")}>{value}{unit && <span className="unit">{unit}</span>}</div>
      {(foot||trend) && <div className="kpi-foot">
        {trend && <span className={"trend "+(trendDir||'up')}>{trendDir==='down'?'▾':'▴'} {trend}</span>}
        {foot && <span>{foot}</span>}
      </div>}
    </div>
  );
}

/* ---------- Panel ---------- */
function Panel({ title, sub, right, children, pad=true, style }){
  return (
    <div className="panel" style={style}>
      {(title||right) && <div className="panel-head">
        <div>{title && <div className="panel-title">{title}</div>}{sub && <div className="panel-sub">{sub}</div>}</div>
        {right}
      </div>}
      <div className="panel-body" style={pad?null:{padding:0}}>{children}</div>
    </div>
  );
}

function Empty({ children, height=160 }){
  return <div className="empty" style={{minHeight:height}}>{children}</div>;
}

/* ---------- Badge ---------- */
const STATUS_MAP = {
  "Complied":"ok","OK":"ok","Low":"ok",
  "Due Soon":"warn","In Progress":"info","Ongoing":"info","Medium":"warn",
  "Revision Required":"danger","High":"danger","ACTION REQUIRED":"danger","Expired":"danger",
  "Needs area (sft)":"warn",
  "Not Due":"muted","Not Applicable":"muted","Unclassified":"muted","NA":"muted",
};
function Badge({ children, kind }){
  if(children===null||children===undefined||children==='') return <span className="muted">—</span>;
  const k = kind || STATUS_MAP[children] || "muted";
  return <span className={"badge "+k}><span className="bdot" style={{background:'currentColor'}}></span>{children}</span>;
}

/* ---------- Sortable / filterable DataTable ---------- */
function DataTable({ columns, rows, totalRow, searchable=true, initialSort }){
  const [q,setQ]=uS("");
  const [sort,setSort]=uS(initialSort||{key:null,dir:1});
  const filtered = uM(()=>{
    let r=rows;
    if(q.trim()){ const s=q.toLowerCase(); r=r.filter(row=>columns.some(c=>String(row[c.key]??'').toLowerCase().includes(s))); }
    if(sort.key){ const c=columns.find(c=>c.key===sort.key);
      r=[...r].sort((a,b)=>{ let av=a[sort.key],bv=b[sort.key];
        if(c&&c.num){ av=isBlank(av)?-Infinity:Number(av); bv=isBlank(bv)?-Infinity:Number(bv); return (av===bv?0:av>bv?1:-1)*sort.dir; }
        return String(av??'').localeCompare(String(bv??''))*sort.dir; }); }
    return r;
  },[q,sort,rows,columns]);
  const toggle=k=>setSort(s=>s.key===k?{key:k,dir:-s.dir}:{key:k,dir:1});
  return (
    <div>
      {searchable && <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,gap:12,flexWrap:'wrap'}}>
        <div className="search"><input placeholder="Filter…" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <span className="uplabel">{filtered.length} of {rows.length} rows</span>
      </div>}
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr>
            {columns.map(c=>(
              <th key={c.key} className={(c.num?'num ':'')+(c.noSort?'no-sort ':'')+(sort.key===c.key?'sorted':'')}
                onClick={()=>!c.noSort&&toggle(c.key)}>
                {c.label}{!c.noSort && <span className="sort-ar">{sort.key===c.key?(sort.dir>0?'▲':'▼'):'⇅'}</span>}
              </th>
            ))}
          </tr></thead>
          <tbody>
            {filtered.length===0 && <tr><td colSpan={columns.length} style={{padding:'32px 16px',textAlign:'center',color:'var(--ink-3)'}}>No matching rows.</td></tr>}
            {filtered.map((row,i)=>(
              <tr key={i}>
                {columns.map(c=>(
                  <td key={c.key} className={c.num?'num':''}>{c.render?c.render(row[c.key],row):dash(row[c.key])}</td>
                ))}
              </tr>
            ))}
            {totalRow && <tr className="total-row">
              {columns.map((c,i)=>(<td key={c.key} className={c.num?'num':''}>{totalRow[c.key]??(i===0?'Total':'')}</td>))}
            </tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const AssetChip = ({ id }) => <span className="achip"><span className="dot" style={{background:assetColorOf(id)}}></span>{assetName(id)}</span>;
const assetColumn = {key:'assetId',label:'Asset',render:v=><AssetChip id={v}/>};

Object.assign(window, { TopBar, PillSelect, TabNav, PageHead, Kpi, Panel, Empty, Badge, DataTable, AssetChip, assetColumn,
  assetColorOf, FUND, seriesOf, monthRow, assetName, monthLabelOf, periodToDate, sumKey, hasAny, collectionEfficiency, dash });

</script>

<script type="text/babel">
/* =====================================================================
   SECTIONS — Portfolio + Asset Overview
   ===================================================================== */

function AreaStat({ label, value, unit, color }){
  return (
    <div style={{display:'flex',alignItems:'center',gap:11}}>
      <span style={{width:10,height:10,borderRadius:3,background:color,flexShrink:0}}></span>
      <div style={{flex:1}}>
        <div className="mono" style={{fontSize:9.5,letterSpacing:'.1em',textTransform:'uppercase',color:'var(--ink-3)'}}>{label}</div>
        <div className="tnum" style={{fontSize:18,fontWeight:700,letterSpacing:'-.02em'}}>{value}<span style={{fontSize:11,color:'var(--ink-2)',fontWeight:600,marginLeft:3}}>{unit}</span></div>
      </div>
    </div>
  );
}

function OccupancyPanel({ row, sub }){
  return (
    <Panel title="Occupancy" sub={sub}>
      <div style={{display:'flex',alignItems:'center',gap:20,flexWrap:'wrap',justifyContent:'center'}}>
        <Donut value={row.occupancy} center={fmtFixed(row.occupancy,1,'%')} label="Leased" color="var(--brand-orange)" size={146}/>
        <div style={{flex:1,minWidth:150,display:'flex',flexDirection:'column',gap:14}}>
          <AreaStat label="Leasable Area" value={fmtSft(row.leasable)} unit="sft" color="var(--ink-3)"/>
          <AreaStat label="Leased Area" value={fmtSft(row.leased)} unit="sft" color="var(--brand-maroon)"/>
          <AreaStat label="Vacant Area" value={fmtSft(row.vacant)} unit="sft" color="var(--vacant)"/>
        </div>
      </div>
    </Panel>
  );
}

function RevComposition({ data }){
  const total = data.reduce((a,d)=>a+num(d.value),0);
  const colors=['var(--brand-maroon)','var(--brand-orange)','var(--d3)','var(--d5)','var(--d4)','var(--d6)'];
  const color = i => colors[i%colors.length];
  const share = v => total ? Math.round(num(v)/total*100) : 0;
  const on=useChartReveal();
  if(!total) return <Empty>No revenue recorded for this month.</Empty>;
  return (
    <div>
      <div style={{display:'flex',height:18,borderRadius:6,overflow:'hidden',marginBottom:16}}>
        {data.map((d,i)=>(
          <div key={i}
            onMouseMove={e=>showTip(`<div class="tip-row"><span class="tdot" style="background:${color(i)}"></span><span class="tip-k">${escHtml(d.label)}</span></div><b>${fmtCr(d.value)} · ${share(d.value)}%</b>`,e.clientX,e.clientY)}
            onMouseLeave={hideTip}
            style={{width:on?`${num(d.value)/total*100}%`:'0%',background:color(i),transition:`width .32s cubic-bezier(.2,.8,.2,1) ${i*.08}s`,cursor:'default'}}/>
        ))}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:11}}>
        {data.map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{width:10,height:10,borderRadius:3,background:color(i)}}></span>
            <span style={{fontSize:12.5,fontWeight:600,flex:1}}>{d.label}</span>
            <span className="mono tnum" style={{fontSize:11.5,color:'var(--ink-2)'}}>{fmtCr(d.value)}</span>
            <span className="mono tnum" style={{fontSize:11,color:'var(--ink-3)',width:38,textAlign:'right'}}>{share(d.value)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================ PORTFOLIO ============================ */
function PortfolioSection({ month }){
  const D = window.DASH;
  const F = monthRow(FUND, month) || {};
  const label = monthLabelOf(month);
  const fundTenants = D.tenants[FUND] || {};
  const collEff = collectionEfficiency(F);

  const rows = D.assets.map(a=>{
    const r = monthRow(a.id, month) || {};
    return { id:a.id, name:a.name, leasable:r.leasable, leased:r.leased, occupancy:r.occupancy, psf:r.psf,
             monthlyRent:r.monthlyRent, collections:r.collections, wale:(D.tenants[a.id]||{}).wale };
  });

  const mix = D.revenueMix.filter(r=>r.key===month);
  const revenue = mix.length
    ? Object.values(mix.reduce((acc,r)=>{ (acc[r.line]=acc[r.line]||{label:r.line,value:0}).value+=num(r.value); return acc; },{}))
    : [{label:'Rental Collections',value:F.rentalCollections},{label:'CAM Collections',value:F.camCollections},{label:'Other Collections',value:F.otherCollections}];

  const spread = (D.rentSpread.fund||[]).map(b=>({band:b.band, area:Math.round(num(b.sft)/100)/10}));
  const trend = seriesOf(FUND);
  const annual = D.annual[FUND] || [];

  return (
    <div className="fade-in">
      <div className="grid" style={{gridTemplateColumns:'repeat(6,minmax(0,1fr))'}}>
        <Kpi label="Monthly Rent" value={fmtCr(F.monthlyRent)} foot={`rent billed · ${label}`}/>
        <Kpi label="Monthly CAM" value={fmtCr(F.monthlyCam)} foot={`CAM billed · ${label}`}/>
        <Kpi label="Gross Billing" value={fmtCr(F.grossBilling)} foot="rent + CAM"/>
        <Kpi label="Collections" value={fmtCr(F.collections)} foot={collEff!=null?`rent + CAM collected: ${collEff.toFixed(0)}% of billing`:'collections inflow'}/>
        <Kpi label="Occupancy" value={fmtFixed(F.occupancy,1)} unit="%" foot={`${fmtSft(F.leased)} of ${fmtSft(F.leasable)} sft`}/>
        <Kpi label="WALE" value={fmtFixed(fundTenants.wale,2)} unit="yrs" foot={`area-weighted · as of ${D.meta.asOf}`}/>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Assets Summary" sub={`${label} · ${rows.length} assets`} pad={false}>
          <div style={{padding:'0 4px 4px'}}>
            <DataTable
              searchable={false}
              initialSort={{key:'monthlyRent',dir:-1}}
              columns={[
                {key:'name',label:'Asset',render:(v,r)=><AssetChip id={r.id}/>},
                {key:'leasable',label:'Leasable sft',num:true,render:fmtSft},
                {key:'leased',label:'Leased sft',num:true,render:fmtSft},
                {key:'occupancy',label:'Occ. %',num:true,render:v=>isBlank(v)?'—':<b style={{color:v>=90?'var(--ok)':v>=80?'var(--warn)':'var(--danger)'}}>{fmtFixed(v,1,'%')}</b>},
                {key:'psf',label:'Rent ₹/sf',num:true,render:v=>fmtFixed(v,1)},
                {key:'monthlyRent',label:'Monthly Rent',num:true,render:fmtCr},
                {key:'collections',label:'Collections',num:true,render:fmtCr},
                {key:'wale',label:'WALE yrs',num:true,render:v=>fmtFixed(v,2)},
              ]}
              rows={rows}
              totalRow={{name:'Fund',leasable:fmtSft(F.leasable),leased:fmtSft(F.leased),occupancy:fmtFixed(F.occupancy,1,'%'),psf:fmtFixed(F.psf,1),monthlyRent:fmtCr(F.monthlyRent),collections:fmtCr(F.collections),wale:fmtFixed(fundTenants.wale,2)}}
            />
          </div>
          {F.psfExcluded && F.psfExcluded.length>0 && <div className="note" style={{margin:'0 20px 20px'}}>
            Fund rent ₹/sf excludes {F.psfExcluded.map(assetName).join(', ')}: its PSF is blank in 2_MONTHLY_INPUT for {label}.
          </div>}
        </Panel>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr 1fr 1fr',marginTop:18,alignItems:'start'}}>
        <OccupancyPanel row={F} sub={`leased vs leasable · ${label}`}/>
        <Panel title="Rent Spread" sub={`K sft leased by rent band${D.rentSpread.asOf?` · as of ${D.rentSpread.asOf}`:''}`}>
          {spread.length ? <DistBars data={spread} unit="K sft"/> : <Empty>No rent bands in 3_REVENUE_RENT.</Empty>}
        </Panel>
        <Panel title="Revenue Composition" sub={mix.length?`revenue lines · ${label}`:`collections by type · ${label}`}>
          <RevComposition data={revenue}/>
          {!mix.length && <div className="muted" style={{fontSize:11.5,marginTop:14,lineHeight:1.5}}>3A_REVENUE_MIX has no rows yet, so this splits the month's collections inflow.</div>}
        </Panel>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr 1.4fr',marginTop:18,alignItems:'start'}}>
        <Panel title="Monthly Rent by Asset" sub={`₹Cr · ${label}`}>
          <HBars data={rows.map(r=>({name:r.name,value:r.monthlyRent,color:assetColorOf(r.id)}))}/>
        </Panel>
        <Panel title="Gross Billing vs Collections" sub={`₹Cr · fund · ${trend.length} reported month${trend.length===1?'':'s'}`}>
          <VBars data={trend} series={[{key:'grossBilling',name:'Gross Billing',color:'var(--d3)'},{key:'collections',name:'Collections',color:'var(--brand-orange)'}]}/>
        </Panel>
      </div>

      <div className="grid" style={{gridTemplateColumns:'1fr',marginTop:18}}>
        <Panel title="Rent Spread by Asset" sub="K sft per band">
          {Object.keys(D.rentSpread.byAsset||{}).length
            ? <DataTable searchable={false}
                columns={[{key:'id',label:'Asset',render:v=><AssetChip id={v}/>}, ...(D.rentSpread.fund||[]).map((b,i)=>({key:'b'+i,label:b.band,num:true,render:fmtKsft}))]}
                rows={Object.entries(D.rentSpread.byAsset).map(([id,bands])=>Object.assign({id},...bands.map((b,i)=>({['b'+i]:b.sft}))))}/>
            : <Empty>No by-asset rent spread in 3_REVENUE_RENT.</Empty>}
        </Panel>
      </div>

      <div className="section-label"><span className="bar"></span><h3>Annual Summary · June to May</h3></div>
      <Panel pad={false}>
        <div style={{padding:'4px'}}>
          <AnnualTable rows={annual}/>
        </div>
      </Panel>
    </div>
  );
}

function AnnualTable({ rows }){
  return (
    <DataTable
      searchable={false}
      columns={[
        {key:'period',label:'Period',render:v=><b>{v}</b>},
        {key:'monthsReported',label:'Months',num:true,render:(v,r)=>`${v} (${r.from}–${r.to})`},
        {key:'grossBilling',label:'Gross Billing',num:true,render:fmtCr},
        {key:'collections',label:'Collections',num:true,render:fmtCr},
        {key:'totalExpense',label:'Total Expense',num:true,render:fmtCr},
        {key:'netSurplus',label:'Net Surplus',num:true,render:fmtCr},
        {key:'capex',label:'Capex',num:true,render:fmtCr},
        {key:'openingBalance',label:'Opening',num:true,render:fmtCr},
        {key:'closingBalance',label:'Closing (latest)',num:true,render:v=><b>{fmtCr(v)}</b>},
      ]}
      rows={rows}
    />
  );
}

/* ============================ ASSET OVERVIEW ============================ */
function Stat({ k, v, wide }){
  return <div className="stat" style={wide?{gridColumn:'1 / -1'}:null}><div className="k">{k}</div><div className="v">{dash(v)}</div></div>;
}

function AssetProfile({ asset, row, wale }){
  const [imageOk,setImageOk]=React.useState(true);
  return (
    <div className="grid" style={{gridTemplateColumns:'1fr 1.25fr 1fr',alignItems:'stretch'}}>
      <Panel title={asset.name} sub={asset.city}>
        <div className="stat-grid">
          <Stat k="Address" v={asset.address} wide/>
          <Stat k="Leasable Area" v={`${fmtSft(isBlank(row.leasable)?asset.leasable:row.leasable)} sft`}/>
          <Stat k="WALE" v={isBlank(wale)?null:`${fmtFixed(wale,2)} yrs`}/>
          <Stat k="Capex till date" v={fmtCr(asset.capexTillDate)}/>
          <Stat k="Coordinates" v={isBlank(asset.latitude)?null:`${fmtFixed(asset.latitude,4)}, ${fmtFixed(asset.longitude,4)}`}/>
          {asset.notes && <Stat k="Notes" v={asset.notes} wide/>}
        </div>
      </Panel>
      <Panel title="Location" sub="Google Maps"
        right={asset.mapLinkUrl && <a className="link" href={asset.mapLinkUrl} target="_blank" rel="noopener noreferrer">Open in Maps ↗</a>}>
        {asset.mapEmbedUrl
          ? <iframe className="map-frame" title={`Map of ${asset.name}`} src={asset.mapEmbedUrl} loading="lazy" referrerPolicy="no-referrer-when-downgrade"></iframe>
          : <div className="img-placeholder">No map link or coordinates in 1_ASSET_MASTER.</div>}
      </Panel>
      <Panel title="Asset Image" sub={asset.imageAlt}>
        {asset.imageUrl && imageOk
          ? <img className="asset-img" src={asset.imageUrl} alt={asset.imageAlt||asset.name} onError={()=>setImageOk(false)}/>
          : <div className="img-placeholder">
              <b style={{color:'var(--ink-2)'}}>{asset.imageUrl?'Image could not be loaded':'No image link yet'}</b>
              <span>Add “Asset Image URL / File Link” in 1_ASSET_MASTER.</span>
            </div>}
      </Panel>
    </div>
